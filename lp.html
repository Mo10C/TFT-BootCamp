<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LPランキング ｜ クラウドハッシュテイル校 TOOLS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7CA455">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=4.10">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* 1人1本の横長バンド。線の色は「誰か」を表さないので全員同じ1色。
   dataviz の検証済み配色から1色だけ使う。 */
.viz{
  --line:#2a78d6;
  --line-soft:color-mix(in srgb, #2a78d6 15%, transparent);
  --grid:color-mix(in srgb, var(--ink) 10%, transparent);
  --axis:color-mix(in srgb, var(--ink) 26%, transparent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .viz{
    --line:#3987e5;
    --line-soft:color-mix(in srgb, #3987e5 20%, transparent);
    --grid:color-mix(in srgb, var(--ink) 14%, transparent);
    --axis:color-mix(in srgb, var(--ink) 32%, transparent);
  }
}
:root[data-theme="dark"] .viz{
  --line:#3987e5;
  --line-soft:color-mix(in srgb, #3987e5 20%, transparent);
  --grid:color-mix(in srgb, var(--ink) 14%, transparent);
  --axis:color-mix(in srgb, var(--ink) 32%, transparent);
}

.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-soft);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--border)}
.panel-head h2{font-size:14px;font-weight:900}
.panel-head .sub{font-size:10.5px;color:var(--muted)}
.spacer{flex:1}

/* ===== 1人ぶんの横長バンド =====
   左のはしら幅をすべての行でそろえてあるので、
   グラフの左端（＝基準日）がどの行でも同じ位置にそろう。 */
.lrow{display:flex;align-items:center;gap:11px;padding:9px 15px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--surface-2)}
.lrow.open{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}

.lrk{font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;color:var(--muted);
  width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.lwho{width:150px;flex:none;display:flex;align-items:center;gap:9px;min-width:0}
.lwho .txt{min-width:0}
.lwho .nm{font-size:12.5px;font-weight:900;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lwho .nm .meb{font-size:8.5px;font-weight:900;color:var(--accent-deep);
  border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);
  border-radius:999px;padding:0 5px;margin-left:5px}
.lwho .tier{font-size:10px;font-weight:900;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lchart{flex:1;min-width:0}
.lchart svg{display:block;width:100%}
.lchart .none{font-size:10.5px;color:var(--muted);padding:14px 0;text-align:center;
  border:1px dashed var(--border-strong);border-radius:10px}

.ldelta{width:106px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.dv{font-family:"Space Grotesk",sans-serif;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35}
.dv .cap{font-family:"Zen Kaku Gothic New",sans-serif;font-size:8.5px;font-weight:700;
  color:var(--muted);margin-right:4px;letter-spacing:.04em}
.dv.up{color:var(--ok)}
.dv.down{color:var(--danger)}
.dv.flat{color:var(--muted)}
.ldelta .scale{font-family:"Space Grotesk",sans-serif;font-size:8.5px;font-weight:700;color:var(--muted)}

/* グループ見出し（生徒 → 先生 → 校長・副校長） */
.ghead{display:flex;align-items:center;gap:9px;padding:9px 16px 7px;
  background:color-mix(in srgb,var(--accent) 9%,var(--surface-2));
  border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.ghead:first-child{border-top:none}
.ghead .gname{font-size:12px;font-weight:900;letter-spacing:.04em}
.ghead .gcount{font-family:"Space Grotesk",sans-serif;font-size:10px;font-weight:700;color:var(--muted)}
.rolewarn{padding:11px 16px;font-size:11.5px;line-height:1.7;
  background:color-mix(in srgb,var(--warn) 12%,var(--surface));
  border-bottom:1px solid var(--border)}
.rolewarn b{color:var(--ink)}
/* 集計が正常なときの帯（緑） */
.okbox{padding:9px 16px;font-size:11.5px;line-height:1.7;color:var(--muted);
  background:color-mix(in srgb,var(--accent) 9%,var(--surface));
  border-bottom:1px solid var(--border)}
.okbox b{color:var(--ink)}
.okbox code,.rolewarn code{font-family:"Space Grotesk",monospace;font-size:10.5px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}

/* 日付のものさし。全行のグラフがこの目盛りにそろっている */
.ruler{display:flex;align-items:center;gap:11px;padding:7px 15px 6px;
  border-bottom:1px solid var(--border);background:var(--surface-2)}
.ruler .pad-rk{width:22px;flex:none}
.ruler .pad-who{width:150px;flex:none;font-size:9.5px;font-weight:900;color:var(--muted)}
.ruler .pad-dl{width:106px;flex:none;font-size:9.5px;font-weight:900;color:var(--muted);text-align:right}
/* グラフ内側の余白（PAD.l / PAD.r）と同じだけ空けて、目盛りを線の始点・終点に合わせる */
.ruler .bar{flex:1;min-width:0;display:flex;justify-content:space-between;
  padding-left:30px;padding-right:62px;
  font-family:"Space Grotesk",sans-serif;font-size:9.5px;font-weight:700;color:var(--muted)}
.ruler .bar .mid{opacity:.75}
.ruler .bar .base{color:var(--accent-deep)}

/* 狭い画面では、名前の行の下にグラフを敷く */
@media (max-width:760px){
  .lrow{flex-wrap:wrap;gap:8px;padding:11px 13px}
  .lwho{flex:1;width:auto}
  .ldelta{width:auto;flex-direction:row;gap:9px;align-items:baseline}
  .ldelta .scale{display:none}
  .lchart{flex:1 1 100%;order:9}
  .ruler{display:none}
}

.range{display:flex;gap:5px;flex-wrap:wrap}
.rbtn{border:1.5px solid var(--border-strong);background:var(--surface);border-radius:999px;
  padding:4px 11px;font-size:11px;font-weight:900;color:var(--muted)}
.rbtn.on{background:var(--grad);color:#fff;border-color:transparent}
select.sortsel{border:1.5px solid var(--border-strong);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}
.tipbox{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;
  padding:7px 11px;font-size:11.5px;line-height:1.55;box-shadow:var(--shadow);opacity:0;
  transition:opacity .1s;z-index:60;white-space:nowrap}
.tipbox.show{opacity:.97}
.tipbox .td{font-weight:900;font-size:10.5px;opacity:.72}
.tipbox .tv{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:12.5px}

/* ---- 急上昇のお祝い ---- */
.cheer{margin-top:14px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 13%,var(--surface)),var(--surface) 62%);
  border:1.5px solid color-mix(in srgb,var(--accent) 42%,var(--border));border-radius:20px;
  box-shadow:var(--shadow-soft)}
.cheer-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 18px 4px}
.cheer-head h2{font-size:15px;font-weight:900}
.cheer-head .sub{font-size:11px;color:var(--muted)}
.cheer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px;padding:12px 18px 18px}
.cheer-card{display:flex;align-items:center;gap:11px;background:var(--surface);
  border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--border));border-radius:16px;padding:12px 14px}
.cheer-card .medal{font-size:24px;line-height:1;flex:none}
.cheer-card .who{min-width:0;flex:1}
.cheer-card .nm{font-size:13.5px;font-weight:900;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cheer-card .rs{font-size:10.5px;color:var(--muted);line-height:1.4}
.cheer-card .gain{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:700;
  color:var(--ok);white-space:nowrap;flex:none}
.cheer-empty{padding:4px 18px 18px;font-size:12px;color:var(--muted);line-height:1.8}
.av{width:32px;height:32px;border-radius:999px;object-fit:cover;flex:none;
  border:1.5px solid var(--border-strong);background:var(--surface-2)}
.avf{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:900;color:#fff;background:var(--grad);
  border:1.5px solid var(--border-strong)}
.cheer-card .av,.cheer-card .avf{width:34px;height:34px;font-size:13px}

.note{font-size:11.5px;color:var(--muted);padding:12px 16px 15px;line-height:1.75;
  border-top:1px solid var(--border)}
.note b{color:var(--ink)}
.tabledata{display:none;padding:0 16px 14px;overflow-x:auto}
.tabledata.show{display:block}
.tabledata table{width:100%;border-collapse:collapse;font-size:11.5px}
.tabledata th,.tabledata td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tabledata th:first-child,.tabledata td:first-child{text-align:left}
.tabledata th{color:var(--muted);font-size:10px;font-weight:700}
.empty{padding:34px 18px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>
<div class="wrap viz">

  <div class="top">
    <div class="brand">
      <div class="brandmark"><img src="assets/tile-lp.png" alt="LPランキング" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>
      <div>
        <h1>LPランキング</h1>
        <div class="sub">クラウドハッシュテイル校 TOOLS</div>
      </div>
    </div>
    <span class="badge" id="roleBadge">—</span>
    <div class="spacer"></div>
    <a class="iconbtn" href="home.html">🏠 HOME</a>
    <a class="iconbtn" id="editorLink" href="editor.html" style="display:none">⚙️ 管理</a>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>LPの推移</h2>
        <div class="sub" id="chartSub">読み込み中…</div>
      </div>
      <div class="spacer"></div>
      <select class="sortsel" id="sortSel" title="並び順">
        <option value="lp">現在のLP順</option>
        <option value="base">基準日からの伸び順</option>
        <option value="day">前日からの伸び順</option>
        <option value="name">名前順</option>
      </select>
      <div class="range">
        <button class="rbtn on" data-mode="base">基準日から</button>
        <button class="rbtn" data-mode="30">30日</button>
        <button class="rbtn" data-mode="90">90日</button>
      </div>
      <button class="rbtn" id="scaleBtn" title="全員のグラフの縦幅を同じLP数にそろえて、伸びの傾きを見比べられるようにします">縦をそろえる</button>
      <button class="rbtn" id="tableBtn">表で見る</button>
    </div>

    <div class="ruler" id="ruler" style="display:none">
      <div class="pad-rk"></div>
      <div class="pad-who">メンバー</div>
      <div class="bar" id="rulerBar"></div>
      <div class="pad-dl">LPの増減</div>
    </div>

    <div class="rolewarn" id="errBox" style="display:none"></div>
    <div class="rolewarn" id="collectBox" style="display:none"></div>
    <div class="rolewarn" id="roleWarn" style="display:none">
      ⚠️ <b>全員が「その他」に入っています。</b>
      LPデータにまだDiscordロールが入っていないためです。
      管理コンソール →「📈 LP」タブ →「👥 メンバーのロール情報を更新」を1回押すと直ります。
    </div>
    <div id="rows"></div>
    <div class="tabledata" id="tableData"></div>
    <div class="note" id="note"></div>
  </div>

  <!-- 急上昇のお祝い -->
  <div class="cheer" id="cheer">
    <div class="cheer-head">
      <div>
        <h2>🎉 今の急上昇プレイヤー</h2>
        <div class="sub" id="cheerSub">—</div>
      </div>
    </div>
    <div class="cheer-grid" id="cheerGrid"></div>
  </div>

</div>
<div class="tipbox" id="tip"></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="core.js?v=4.10"></script>
<script src="home-common.js?v=4.10"></script>
<script>
(function(){
  const C = window.LBCore;
  const $ = id => document.getElementById(id);

  /* core.js が古いと lpRange が無く、グラフが1本も出ない。先に知らせる。 */
  if (!C || typeof C.lpGroupOrder !== "function"){
    document.body.innerHTML =
      '<div style="max-width:560px;margin:16vh auto;padding:30px;text-align:center;' +
      'font-family:sans-serif;line-height:1.9">' +
      '<b style="color:#D3860A">⚠️ core.js が古いバージョンです</b><br><br>' +
      'core.js を新しいものに差し替えてから、強制リロード（Ctrl/⌘ + Shift + R）してください。</div>';
    return;
  }

  const session = C.Session.require();
  if (!session) return;
  const ctx = window.MCCHome.boot(session);
  const myId = "u_" + session.discord.id;

  let lp = null;
  let rows = [];            // 表示順のメンバー
  let opened = null;        // 開いて大きく見ている人のID
  let mode = "base";        // "base" | 30 | 90
  let range = null;         // {from, to, anchored}
  let sameScale = false;    // 縦幅を全員そろえるか
  let sortBy = "lp";
  let order = [];           // 管理コンソールで並べ替えたロールの順

  const MIN_VSPAN = 150;    // これより狭くはしない（小さな揺れを誇張しないため）
  const H_BAND = 58;        // 通常のバンドの高さ(px)
  const H_OPEN = 190;       // 開いたときの高さ(px)

  /* ★ ここでは LP を記録しない。
     ログインした人を「集計の名簿」に載せるだけ（名前・アイコン・ロールの更新）。
     実際のLPは毎日 23:45（日本時間）の自動集計だけが書き込む。 */
  (C.registerLpMember || C.recordLpForSelf)(session).catch(()=>{});

  /* ---------- 小物 ---------- */
  function avatarEl(m){
    if (m.avatar){
      const img = document.createElement("img");
      img.className = "av";
      img.src = m.avatar; img.alt = "";
      img.onerror = function(){
        const f = fallbackAvatar(m);
        if (this.parentNode) this.parentNode.replaceChild(f, this);
      };
      return img;
    }
    return fallbackAvatar(m);
  }
  function fallbackAvatar(m){
    const d = document.createElement("div");
    d.className = "avf";
    d.textContent = (String(m.name || "?").trim()[0] || "?").toUpperCase();
    d.title = m.name || "";
    return d;
  }
  function fmtDelta(v){
    if (v == null) return { txt:"—", cls:"flat" };
    if (v === 0) return { txt:"±0LP", cls:"flat" };
    return { txt:(v>0?"+":"−") + Math.abs(v) + "LP", cls: v>0?"up":"down" };
  }
  function md(k){ return k ? k.slice(5).replace("-","/") : ""; }
  function rankOf(m){ return m.tier ? { tier:m.tier, division:m.division, lp:m.lp } : null; }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  /* 並びは「グループ（生徒 → 先生 → 校長・副校長）」が最優先。
     その中を、右上のセレクトで選んだ順に並べる。
     グループが config.js で未設定のときは、グループ分けせず1つの並びになる。 */
  function sortRows(){
    const key = m => {
      const st = C.lpStats(lp, m.id);
      if (sortBy === "base") return st.baseDelta;
      if (sortBy === "day")  return st.dayDelta;
      return null;
    };
    const inner = (a, b) => {
      if (sortBy === "name") return String(a.name).localeCompare(String(b.name), "ja");
      if (sortBy === "lp") return (b.abs || -1) - (a.abs || -1) ||
        String(a.name).localeCompare(String(b.name), "ja");
      const ka = key(a), kb = key(b);
      if (ka == null && kb == null) return String(a.name).localeCompare(String(b.name), "ja");
      if (ka == null) return 1;
      if (kb == null) return -1;
      return kb - ka;
    };
    rows.sort((a, b) => (a._g - b._g) || inner(a, b));   // _g は assignGroups で振る
  }
  // 各メンバーにセクション番号を振る（0,1,2… / その他は最後）
  function assignGroups(){
    order = C.lpGroupOrder(lp);
    rows.forEach(m => {
      m._g = order.length ? C.lpGroupIndex(m, order) : 0;
      m._label = order.length ? C.lpSectionLabel(m._g, order) : "";
    });
  }

  /* =============================================================
     描画

     ★ 1人 = 横に長いバンド1本。
        左から「順位・アイコン・名前」→「グラフ」→「LPの増減」。
     ★ 左右のはしらの幅は固定なので、グラフの左端（＝基準日）は
        どの行でも同じ位置にそろう。上の日付ものさしと一致する。
     ★ 縦（LP）は既定では人ごとに自動。「縦をそろえる」で全員共通。
     ============================================================= */
  const NS = "http://www.w3.org/2000/svg";
  const mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const dayNum = k => { const [y,m,d] = k.split("-").map(Number); return Date.UTC(y, m-1, d) / 86400000; };
  const spanOf = pts => {
    if (!pts.length) return MIN_VSPAN;
    const vs = pts.map(q => q.v);
    return Math.max.apply(null, vs) - Math.min.apply(null, vs);
  };
  const round50 = v => Math.max(MIN_VSPAN, Math.ceil(v * 1.3 / 50) * 50);

  function render(){
    const box = $("rows");
    box.innerHTML = "";
    range = C.lpRange(lp, mode === "base" ? "base" : mode);
    const days = C.daysBetween(range.from, range.to);

    if (!rows.length){
      if ($("ruler")) $("ruler").style.display = "none";
      box.innerHTML = '<div class="empty">まだ誰も記録されていません。<br>' +
        '<b>メンバーがログインすると、その日のLPが自動で記録されます。</b><br>' +
        '管理コンソールの「📈 LP」タブから、全員ぶんをまとめて取得することもできます。</div>';
      $("chartSub").textContent = "0人";
      return;
    }
    if ($("ruler")) $("ruler").style.display = "";

    const panels = rows.map(m => ({ m, pts: C.lpSeries(lp, m.id, range) }));
    let common = 0;
    if (sameScale){
      panels.forEach(p => { common = Math.max(common, spanOf(p.pts)); });
      common = round50(common);
    }

    let drawn = 0, curLabel = null, nInGroup = 0, noRole = 0;
    panels.forEach(p => {
      if (p.pts.length) drawn++;
      // 見出し名が変わったら新しいセクション。
      // 隣どうしで同じ見出し名にしてあるロールは、ここで自然に1つにまとまる。
      if (order.length && p.m._label !== curLabel){
        curLabel = p.m._label;
        nInGroup = 0;
        box.appendChild(groupHead(curLabel, panels.filter(x => x.m._label === curLabel).length));
      }
      nInGroup++;
      if (order.length && p.m._g >= order.length) noRole++;
      box.appendChild(buildRow(p, nInGroup, sameScale ? common : round50(spanOf(p.pts))));
    });
    // ロール情報がまだ入っていない人が居ると、全員「その他」に落ちる
    if ($("roleWarn")) $("roleWarn").style.display = (order.length && noRole >= rows.length) ? "" : "none";

    // 日付のものさし（グラフ列の真上）
    /* ★ 期間が短いと 左端／真ん中／右端 が同じ日付になり、文字が重なって見える。
       日付が重複しないときだけ真ん中を出す。 */
    const mid = C.shiftDay(range.from, Math.round(days / 2));
    const showMid = days >= 6 && mid !== range.from && mid !== range.to;
    const oneDay  = range.from === range.to;
    $("rulerBar").innerHTML =
      '<span class="' + (range.anchored ? "base" : "") + '">' +
        (range.anchored ? "★ " : "") + md(range.from) + '</span>' +
      (showMid ? '<span class="mid">' + md(mid) + '</span>' : "") +
      (oneDay  ? "" : '<span>' + md(range.to) + '</span>');

    $("chartSub").textContent =
      md(range.from) + " 〜 " + md(range.to) + "（" + (days + 1) + "日）" +
      " ・ " + rows.length + "人中" + drawn + "人に記録あり" +
      (sameScale ? " ・ 縦幅はどれも " + common + "LPぶん" : " ・ 縦幅は人ごとに自動") +
      (range.anchored ? " ・ 左端＝基準日 " + lp.baseline : "");

    drawAll();
  }

  /* グループの見出し（生徒 / 先生 / 校長・副校長 / その他） */
  function groupHead(label, count){
    const h = document.createElement("div");
    h.className = "ghead";
    const nm = document.createElement("span");
    nm.className = "gname";
    nm.textContent = label;
    const ct = document.createElement("span");
    ct.className = "gcount";
    ct.textContent = count + "人";
    h.appendChild(nm); h.appendChild(ct);
    return h;
  }

  function buildRow(p, idx, vspan){
    const m = p.m, st = C.lpStats(lp, m.id);
    const row = document.createElement("div");
    row.className = "lrow" + (opened === m.id ? " open" : "");
    row.dataset.pid = m.id;

    const rk = document.createElement("div");
    rk.className = "lrk";
    rk.textContent = idx;
    row.appendChild(rk);

    const who = document.createElement("div");
    who.className = "lwho";
    who.appendChild(avatarEl(m));
    const txt = document.createElement("div"); txt.className = "txt";
    const nm = document.createElement("div"); nm.className = "nm";
    nm.appendChild(document.createTextNode(m.name));
    if (m.id === myId){
      const b = document.createElement("span"); b.className = "meb"; b.textContent = "あなた";
      nm.appendChild(b);
    }
    const tier = document.createElement("div"); tier.className = "tier";
    tier.textContent = C.rankLabel(rankOf(m));
    tier.style.color = C.rankColor(rankOf(m));
    txt.appendChild(nm); txt.appendChild(tier);
    who.appendChild(txt);
    row.appendChild(who);

    const chart = document.createElement("div");
    chart.className = "lchart";
    chart._panel = p;                       // 幅が決まってから描くので、ここでは持たせるだけ
    chart._vspan = vspan;
    row.appendChild(chart);

    const dl = document.createElement("div");
    dl.className = "ldelta";
    const d1 = fmtDelta(st.dayDelta);
    const e1 = document.createElement("div");
    e1.className = "dv " + d1.cls;
    e1.innerHTML = '<span class="cap">前日</span>' + d1.txt;
    e1.title = st.prevDate ? ("前回計測 " + st.prevDate + " と比較") : "比較できる記録がまだありません";
    dl.appendChild(e1);
    if (lp.baseline){
      const d2 = fmtDelta(st.baseDelta);
      const e2 = document.createElement("div");
      e2.className = "dv " + d2.cls;
      e2.innerHTML = '<span class="cap">基準</span>' + d2.txt;
      e2.title = st.baseDate ? ("基準 " + lp.baseline + "（実測 " + st.baseDate + "）と比較") : "";
      dl.appendChild(e2);
    }
    if (!sameScale && p.pts.length){
      const sc = document.createElement("div");
      sc.className = "scale";
      sc.textContent = "縦" + vspan + "LP";
      sc.title = "このグラフの縦の幅。人ごとに自動で決まります（「縦をそろえる」で全員共通にできます）";
      dl.appendChild(sc);
    }
    row.appendChild(dl);

    row.onclick = e => {
      if (e.target.closest("a,button,select")) return;
      opened = (opened === m.id) ? null : m.id;
      render();
    };
    return row;
  }

  /* 実際の表示幅が決まってから SVG を作る。
     ぴったりの幅で描くので、線が横に伸びて太さが崩れることがない。 */
  function drawAll(){
    document.querySelectorAll(".lchart").forEach(host => {
      const p = host._panel;
      if (!p) return;
      const w = Math.max(140, Math.round(host.clientWidth));
      host.innerHTML = "";
      if (!p.pts.length){
        const e = document.createElement("div");
        e.className = "none";
        e.textContent = "この期間の記録がまだありません";
        host.appendChild(e);
        return;
      }
      const open = (opened === p.m.id);
      host.appendChild(drawChart(p, host._vspan, w, open ? H_OPEN : H_BAND, open));
    });
  }

  function drawChart(p, vspan, w, h, detailed){
    const m = p.m;
    const PAD = { l:30, r:62, t:8, b: detailed ? 16 : 7 };

    const vs = p.pts.map(q => q.v);
    const mid = (Math.max.apply(null, vs) + Math.min.apply(null, vs)) / 2;
    let lo = mid - vspan / 2, hi = mid + vspan / 2;
    if (lo < 0){ hi -= lo; lo = 0; }

    const x0 = dayNum(range.from), x1 = dayNum(range.to);
    const X = k => PAD.l + (dayNum(k) - x0) / Math.max(1, x1 - x0) * (w - PAD.l - PAD.r);
    const Y = v => h - PAD.b - (v - lo) / (hi - lo) * (h - PAD.t - PAD.b);

    const svg = mk("svg", {
      viewBox: "0 0 " + w + " " + h, width: w, height: h,
      style: "height:" + h + "px", role: "img",
      "aria-label": m.name + " のLP推移 " + range.from + " から " + range.to
    });

    // ティアの境目（この題材ならではの目盛り）
    C.tierLines(lo, hi).forEach(t => {
      svg.appendChild(mk("line", { x1:PAD.l, x2:w-PAD.r, y1:Y(t.v), y2:Y(t.v),
        stroke:"var(--grid)", "stroke-width":"1" }));
      const lb = mk("text", { x:PAD.l-5, y:Y(t.v)+3, "text-anchor":"end", "font-size":"7.5",
        fill:"var(--muted)", "font-weight":"700" });
      lb.textContent = t.name.slice(0, 4);
      svg.appendChild(lb);
    });
    // 下の軸
    svg.appendChild(mk("line", { x1:PAD.l, x2:w-PAD.r, y1:h-PAD.b, y2:h-PAD.b,
      stroke:"var(--axis)", "stroke-width":"1" }));
    // 基準日の縦線（左端）
    if (range.anchored){
      svg.appendChild(mk("line", { x1:PAD.l, x2:PAD.l, y1:PAD.t, y2:h-PAD.b,
        stroke:"var(--accent)", "stroke-width":"1.5", "stroke-dasharray":"3 3", opacity:".85" }));
    }

    // 面 → 線 の順（面が線を覆わないように）
    const dLine = p.pts.map((q, i) => (i ? "L" : "M") + X(q.d).toFixed(1) + " " + Y(q.v).toFixed(1)).join(" ");
    if (p.pts.length > 1){
      const a = p.pts[0], z = p.pts[p.pts.length - 1];
      svg.appendChild(mk("path", {
        d: dLine + " L" + X(z.d).toFixed(1) + " " + (h-PAD.b) + " L" + X(a.d).toFixed(1) + " " + (h-PAD.b) + " Z",
        fill:"var(--line-soft)", stroke:"none" }));
    }
    svg.appendChild(mk("path", { d:dLine, fill:"none", stroke:"var(--line)",
      "stroke-width":"2", "stroke-linejoin":"round", "stroke-linecap":"round" }));

    // 点。詰まりすぎるときは両端だけ
    const gap = (w - PAD.l - PAD.r) / Math.max(1, p.pts.length - 1);
    const dots = (gap >= 11 || p.pts.length <= 2) ? p.pts : [p.pts[0], p.pts[p.pts.length - 1]];
    dots.forEach(q => {
      svg.appendChild(mk("circle", { cx:X(q.d), cy:Y(q.v), r: detailed ? "4" : "3.2",
        fill:"var(--line)", stroke:"var(--surface)", "stroke-width":"2" }));
    });

    // 右はしに現在のランクを直接ラベル（色だけに頼らない）
    // ★ 絶対LP（2279 など）は内部用の通し数値なので、そのままは出さない。
    //   いちばん新しい点は、保存してある実際のランクを使う（GM/チャレも正しく出る）。
    const last = p.pts[p.pts.length - 1];
    const curRank = rankOf(m);
    const txt = (curRank && (m.abs | 0) === last.v) ? C.rankShort(curRank) : C.absToShort(last.v);
    const lbl = mk("text", { x: w - PAD.r + 6, y: Math.max(10, Math.min(h - PAD.b, Y(last.v) + 3.5)),
      "font-size":"10", fill:"var(--ink)", "font-weight":"900" });
    lbl.textContent = txt;
    const tt = mk("title");
    tt.textContent = C.absToLabel(last.v) + "（" + last.d + "）";
    lbl.appendChild(tt);
    svg.appendChild(lbl);

    // 開いているときだけ、日付とLPの目盛りを足す
    if (detailed){
      const n = C.daysBetween(range.from, range.to);
      // ★ 期間が短いと同じ日付が何度も出て重なるので、目盛りの数を日数に合わせる
      const ticks = Math.max(1, Math.min(3, n));
      const seen = {};
      for (let i = 0; i <= ticks; i++){
        const k = C.shiftDay(range.from, Math.round(n * i / ticks));
        if (seen[k]) continue;
        seen[k] = 1;
        const t = mk("text", { x:X(k), y:h-4,
          "text-anchor": i === 0 ? "start" : (i === ticks ? "end" : "middle"),
          "font-size":"8.5", fill:"var(--muted)", "font-weight":"700" });
        t.textContent = md(k);
        svg.appendChild(t);
      }
      p.pts.forEach((q, i) => {
        if (i === p.pts.length - 1) return;      // 右はしの数字と重なるので最後は出さない
        if (gap < 46) return;                    // 詰まりすぎるときは数字を出さない
        const t = mk("text", { x:X(q.d), y:Y(q.v)-9, "text-anchor":"middle", "font-size":"8",
          fill:"var(--muted)", "font-weight":"700" });
        t.textContent = C.absToShort(q.v);
        svg.appendChild(t);
      });
    }

    // ホバー
    const cross = mk("line", { x1:0, x2:0, y1:PAD.t, y2:h-PAD.b, stroke:"var(--axis)",
      "stroke-width":"1", "stroke-dasharray":"3 3", opacity:"0" });
    svg.appendChild(cross);
    const cur = mk("circle", { cx:0, cy:0, r:"5", fill:"var(--line)",
      stroke:"var(--surface)", "stroke-width":"2.5", opacity:"0" });
    svg.appendChild(cur);
    const hit = mk("rect", { x:PAD.l, y:0, width:w-PAD.l-PAD.r, height:h,
      fill:"transparent", style:"cursor:crosshair" });
    svg.appendChild(hit);

    const tip = $("tip");
    function move(ev){
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * w;
      let best = null, bd = Infinity;                       // いちばん近い実測点
      p.pts.forEach(q => { const dd = Math.abs(X(q.d) - px); if (dd < bd){ bd = dd; best = q; } });
      if (!best) return;
      cross.setAttribute("x1", X(best.d)); cross.setAttribute("x2", X(best.d));
      cross.setAttribute("opacity", ".7");
      cur.setAttribute("cx", X(best.d)); cur.setAttribute("cy", Y(best.v)); cur.setAttribute("opacity", "1");
      tip.innerHTML = '<div class="td">' + escapeHtml(m.name) + ' ・ ' + best.d + '</div>' +
        '<div class="tv">' + C.absToLabel(best.v) + '</div>';
      tip.classList.add("show");
      let left = ev.clientX + 14;
      if (left + tip.offsetWidth > window.innerWidth - 8) left = ev.clientX - tip.offsetWidth - 14;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, ev.clientY - 48) + "px";
    }
    function leave(){
      tip.classList.remove("show");
      cross.setAttribute("opacity", "0");
      cur.setAttribute("opacity", "0");
    }
    hit.addEventListener("mousemove", move);
    hit.addEventListener("touchmove", e => { if (e.touches[0]) move(e.touches[0]); });
    hit.addEventListener("touchend", leave);
    hit.addEventListener("mouseleave", leave);

    return svg;
  }

  /* 画面幅が変わったら、グラフだけ描き直す（行は作り直さない） */
  let rz = null;
  window.addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(drawAll, 140);
  });

  /* 表ビュー（グラフが読みづらい場合の代替） */
  function renderTable(){
    const box = $("tableData");
    if (!box.classList.contains("show")) return;
    const ids = rows.map(m => m.id);
    const dates = new Set();
    ids.forEach(id => C.lpSeries(lp, id, range).forEach(p => dates.add(p.d)));
    const ds = [...dates].sort();
    if (!ds.length){ box.innerHTML = '<div class="hint">この期間のデータがありません</div>'; return; }
    let html = "<table><tr><th>日付</th>" +
      ids.map(id => "<th>" + escapeHtml((lp.members[id]||{name:id}).name) + "</th>").join("") + "</tr>";
    ds.forEach(d => {
      html += "<tr><td>" + d + (d === lp.baseline ? " ★基準" : "") + "</td>" + ids.map(id => {
        const h = (lp.hist[id] || {});
        return "<td>" + (h[d] != null ? C.absToLabel(h[d]) : "—") + "</td>";
      }).join("") + "</tr>";
    });
    box.innerHTML = html + "</table>";
  }
  $("tableBtn").onclick = () => {
    const el = $("tableData");
    el.classList.toggle("show");
    $("tableBtn").classList.toggle("on", el.classList.contains("show"));
    renderTable();
  };
  $("scaleBtn").onclick = () => {
    sameScale = !sameScale;
    $("scaleBtn").classList.toggle("on", sameScale);
    render();
  };
  $("sortSel").onchange = () => { sortBy = $("sortSel").value; assignGroups(); sortRows(); render(); };
  document.querySelectorAll(".rbtn[data-mode]").forEach(b => {
    b.onclick = () => {
      const v = b.dataset.mode;
      mode = (v === "base") ? "base" : parseInt(v, 10);
      document.querySelectorAll(".rbtn[data-mode]").forEach(x => x.classList.toggle("on", x === b));
      render(); renderTable();
    };
  });

  /* 急上昇: 「基準日から」を優先し、無ければ「前回比」。お祝いなので上がった人だけ。 */
  function renderCheer(){
    const useBase = !!lp.baseline;
    const list = rows.map(m => {
      const st = C.lpStats(lp, m.id);
      return { m, st, gain: useBase ? st.baseDelta : st.dayDelta };
    }).filter(x => x.gain != null && x.gain > 0)
      .sort((a, b) => b.gain - a.gain)
      .slice(0, 6);

    $("cheerSub").textContent = useBase
      ? ("基準日 " + lp.baseline + " からの伸び")
      : "前回計測からの伸び（基準日を設定すると期間で集計できます）";

    const grid = $("cheerGrid");
    grid.innerHTML = "";
    if (!list.length){
      grid.innerHTML = '<div class="cheer-empty" style="grid-column:1/-1">' +
        'まだ上昇している人がいません。記録が2日ぶん以上たまると、ここに伸びた人が並びます。</div>';
      return;
    }
    const medals = ["🥇","🥈","🥉","✨","✨","✨"];
    list.forEach((x, i) => {
      const card = document.createElement("div");
      card.className = "cheer-card";
      const mdl = document.createElement("div");
      mdl.className = "medal";
      mdl.textContent = medals[i] || "✨";
      const who = document.createElement("div"); who.className = "who";
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = x.m.name;
      const rs = document.createElement("div"); rs.className = "rs";
      rs.textContent = C.rankLabel(rankOf(x.m));
      who.appendChild(nm); who.appendChild(rs);
      const g = document.createElement("div");
      g.className = "gain";
      g.textContent = "+" + x.gain + "LP";
      card.appendChild(mdl); card.appendChild(avatarEl(x.m)); card.appendChild(who); card.appendChild(g);
      card.onclick = () => {
        opened = x.m.id;
        render();
        const el = document.querySelector('.lrow[data-pid="' + x.m.id + '"]');
        if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
      };
      card.style.cursor = "pointer";
      grid.appendChild(card);
    });
  }

 

  /* ★ 自動集計(23:45)がちゃんと動いているかを出す。
     動いていなければ「グラフが伸びない／数値が古い」の原因がここだと一目で分かる。 */
  function renderCollectStatus(){
    const box = $("collectBox");
    if (!box) return;
    box.className = "rolewarn";          // 毎回いったん警告の見た目に戻す
    const today = C.dayKey();
    const last  = lp.lastCollect || "";
    const at    = lp.lastCollectAt ? new Date(lp.lastCollectAt + 9*3600*1000) : null;
    const p = n => String(n).padStart(2,"0");
    const hhmm = at ? (p(at.getUTCHours()) + ":" + p(at.getUTCMinutes())) : "";
    if (!last){
      box.style.display = "";
      box.innerHTML = "⚠️ <b>自動集計がまだ1度も動いていません。</b>" +
        "Cloudflare の Cron（<code>45 14 * * *</code> ＝日本時間23:45）と <code>RIOT_API_KEY</code> を確認してください。" +
        "管理コンソール →「📈 LP」→「全員のLPを今すぐ記録」で手動集計もできます。";
      return;
    }
    const behind = C.daysBetween(last, today);
    if (behind >= 2){
      box.style.display = "";
      box.innerHTML = "⚠️ <b>自動集計が " + behind + "日 止まっています。</b>（最終集計 " + last +
        (hhmm ? " " + hhmm : "") + "）Riot APIキーの期限切れが多い原因です。管理コンソールの「🔌 接続設定」で確認できます。";
      return;
    }
    box.style.display = "";
    box.className = "okbox";
    box.innerHTML = "✅ 最終集計 <b>" + last + (hhmm ? " " + hhmm : "") + "</b>（日本時間）。毎日23:45に自動で更新されます。";
  }

  /* ---------- 起動 ----------
     ★ 「読み込み」と「描画」を分けてある。
        以前はどちらで転んでも「LPデータの読み込みに失敗しました」と出てしまい、
        本当の原因が分からなかった。いまは、どこで・何が起きたかを画面に出す。
        1か所が転んでも、他の部分はそのまま表示される。 */
  function showErr(where, e){
    const msg = String((e && (e.message || e.name)) || e || "不明なエラー");
    console.error("[LP] " + where + " で失敗", e);
    const box = $("errBox");
    if (!box) { ctx.toast(where + ": " + msg); return; }
    box.style.display = "";
    box.innerHTML = "⚠️ <b>" + escapeHtml(where) + " でエラーが起きました。</b><br>" +
      "<code>" + escapeHtml(msg) + "</code><br>" +
      "他の部分はそのまま表示されています。直らないときは、この文章をそのまま伝えてください。";
  }
  function step(where, fn){
    try { fn(); } catch(e){ showErr(where, e); }
  }

  function boot(data){
    lp = data || { members:{}, hist:{}, baseline:"", groupOrder:[] };
    rows = Object.values(lp.members || {});
    if (!lp.baseline){
      mode = 30;   // 基準日が無いうちは直近30日で表示する
      document.querySelectorAll(".rbtn[data-mode]").forEach(x =>
        x.classList.toggle("on", x.dataset.mode === "30"));
    }
    step("並び順の割り当て", assignGroups);
    step("並べ替え",       sortRows);
    step("グラフの描画",   render);
    step("急上昇の集計",   renderCheer);
    step("説明文の表示",   renderNote);
  }

  C.loadLpData().then(boot, e => {
    showErr("LPデータの読み込み", e);
    ctx.toast("LPデータを読み込めませんでした: " + String((e && e.message) || e));
  });
})();
</script>
</body>
