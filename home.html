<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HOME ｜ クラウドハッシュテイル校 TOOLS</title>
<meta name="description" content="クラウドハッシュテイル校 TOOLS — Discordログイン式の総合ホーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=3.1">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="brandmark"><img src="assets/emblem.png" alt="クラウドハッシュテイル校" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>
      <div>
        <h1 id="homeTitle">クラウドハッシュテイル校 TOOLS</h1>
        <div class="sub" id="homeSub">Discordログイン式ホーム</div>
      </div>
    </div>
    <span class="badge" id="roleBadge">—</span>
    <div class="spacer"></div>
    <a class="iconbtn" id="editorLink" href="editor.html" style="display:none">⚙️ 管理</a>
    <button class="iconbtn" id="logoutBtn">ログアウト</button>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>

  <!-- 自分 -->
  <div class="mecard">
    <img id="meAvatar" alt="">
    <div class="who">
      <div class="nm" id="meName">—</div>
      <div class="rid num" id="meRiot">—</div>
      <div class="rid num" id="meDid" style="cursor:pointer" title="クリックでコピー"></div>
      <div class="rank" id="meRank">—</div>
      <div class="roles" id="meRoles"></div>
    </div>
  </div>

  <!-- メニュー -->
  <div class="sec">
    <div class="pops" id="pops"></div>
  </div>

  <!-- ツール -->
  <div class="sec" id="toolsSec" style="display:none">
    <div class="sec-head"><h2>🧰 ツール</h2></div>
    <div class="grid" id="tools"></div>
  </div>

</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="core.js?v=3.1"></script>
<script src="home-common.js?v=3.1"></script>
<script>
(function(){
  const C = window.LBCore;
  const CFG = window.MCC_LB_CONFIG || {};
  const $ = id => document.getElementById(id);
  const H = window.MCCHome;

  const session = C.Session.require();
  if (!session) return;
  const ctx = H.boot(session);

  /* 自分の Discord ユーザー名とID（config.js の admins に入れる値）。
     Discord アプリで開発者モードをONにして探さなくても、ここからコピーできる。 */
  (function(){
    const el = $("meDid");
    const d = session.discord || {};
    if (!d.id) return;
    el.textContent = "@" + (d.username || "?") + " ・ ID: " + d.id;
    el.onclick = () => {
      const copy = t => {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
        const ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta);
        return Promise.resolve();
      };
      copy(d.id).then(() => ctx.toast("ユーザーIDをコピーしました: " + d.id));
    };
  })();

  let boardMetaEl = null;

  function renderTiles(home){
    $("homeTitle").textContent = home.title;
    $("homeSub").textContent = home.subtitle;
    document.title = home.title.slice(0, 30) + " ｜ HOME";

    const box = $("pops");
    box.innerHTML = "";
    home.tiles.forEach(t => {
      if (!t.enabled) return;
      if (!C.canSeeEntry(t, session)) return;

      const a = document.createElement("a");
      a.className = "pop" + (t.soon ? " soon" : "");
      a.href = t.url || "#";
      a.style.setProperty("--tint", "var(--" + t.tint + ")");

      if (t.soon){
        const tag = document.createElement("span");
        tag.className = "soon-tag";
        tag.textContent = "準備中";
        a.appendChild(tag);
      }
      const ic = document.createElement("div");
      ic.className = "ico";
      ic.textContent = t.icon;
      const nm = document.createElement("div");
      nm.className = "pt";
      nm.textContent = t.name;
      const de = document.createElement("div");
      de.className = "pd";
      de.textContent = t.desc;
      const me = document.createElement("div");
      me.className = "meta";
      me.textContent = t.soon ? "近日公開" : "開く →";
      a.appendChild(ic); a.appendChild(nm); a.appendChild(de); a.appendChild(me);
      box.appendChild(a);

      // 大会タイルだけ件数を出す
      if (t.url && t.url.indexOf("boards.html") === 0 && !t.soon){
        me.textContent = "読み込み中…";
        boardMetaEl = me;
      }
    });

    if (boardMetaEl){
      C.listAllBoards().then(list => {
        const visible = list.filter(b => C.canViewBoard(b.visibility, session));
        boardMetaEl.textContent = visible.length
          ? ("参加できる大会 " + visible.length + "件 →")
          : (ctx.isAdmin ? "まだありません。作成する →" : "まだありません →");
      }).catch(() => { boardMetaEl.textContent = "開く →"; });
    }
  }

  function renderTools(home){
    const box = $("tools");
    box.innerHTML = "";
    let shown = 0;
    home.tools.forEach(t => {
      if (!C.canSeeEntry(t, session)) return;
      shown++;
      const a = document.createElement("a");
      a.className = "tcard";
      a.href = t.url || "#";
      if (t.external){ a.target = "_blank"; a.rel = "noopener"; }
      const ic = document.createElement("div");
      ic.className = "ico";
      ic.textContent = t.icon;
      const d = document.createElement("div");
      const tt = document.createElement("div");
      tt.className = "tt";
      tt.textContent = t.name;
      d.appendChild(tt);
      if (t.desc){
        const td = document.createElement("div");
        td.className = "td";
        td.textContent = t.desc;
        d.appendChild(td);
      }
      a.appendChild(ic); a.appendChild(d);
      box.appendChild(a);
    });
    $("toolsSec").style.display = shown ? "" : "none";
  }

  /* ---- core.js が古いと関数が無く、ここで落ちてタイルが1枚も出ない。
         黙って白画面にせず、原因と対処を画面に出す。---- */
  const NEED = ["cachedHomeConfig", "homeConfigKey", "defaultHomeConfig", "loadHomeConfig", "canSeeEntry"];
  const missing = NEED.filter(k => typeof C[k] !== "function");
  if (missing.length){
    const box = $("pops");
    box.innerHTML =
      '<div class="empty" style="grid-column:1/-1;text-align:left;line-height:1.8">' +
      '<b style="color:var(--gold)">⚠️ core.js が古いバージョンです</b><br>' +
      'このページが必要とする機能がありません（' + missing.join(", ") + '）。<br><br>' +
      '<b>対処</b><br>' +
      '① 最新の <code>core.js</code> をアップロードしているか確認<br>' +
      '② <b>Ctrl/⌘ + Shift + R</b> でスーパーリロード（ブラウザのキャッシュが原因のことが多いです）<br><br>' +
      '<span style="color:var(--muted);font-size:11.5px">読み込まれている core.js: ' +
      (C.VERSION ? "v" + C.VERSION : "バージョン表記なし（v2.6以前）") + ' ／ このページの想定: v3.1 以降</span>' +
      '</div>';
    console.error("[HOME] core.js が古いため描画を中止しました。不足:", missing);
    return;
  }

  /* 初回描画は「前回このブラウザで見た内容」から行う。
     こうしないと Firestore の応答を待つ間、既定の並び順が一瞬見えてしまう。
     取得後、内容が実際に変わっていたときだけ描き直す（updatedAt の差では描き直さない）。 */
  let shown = C.cachedHomeConfig() || C.defaultHomeConfig();
  renderTiles(shown);
  renderTools(shown);

  C.loadHomeConfig().then(home => {
    if (C.homeConfigKey(home) === C.homeConfigKey(shown)) return;  // 変化なし＝描き直さない
    shown = home;
    boardMetaEl = null;
    renderTiles(home);
    renderTools(home);
  }).catch(e => console.warn("HOME設定", e));
})();
</script>
</body>
</html>
