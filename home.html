<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HOME ｜ マウンテンチョンク校 TOOLS</title>
<meta name="description" content="マウンテンチョンク校 TOOLS — Discordログイン式の総合ホーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="hex">M</div>
      <div>
        <h1>マウンテンチョンク校 TOOLS</h1>
        <div class="sub">Discordログイン式ホーム</div>
      </div>
    </div>
    <span class="badge" id="roleBadge">—</span>
    <div class="spacer"></div>
    <a class="iconbtn" id="editorLink" href="editor.html" style="display:none">⚙️ 管理</a>
    <button class="iconbtn" id="logoutBtn">ログアウト</button>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>

  <!-- 自分 -->
  <div class="mecard">
    <img id="meAvatar" alt="">
    <div class="who">
      <div class="nm" id="meName">—</div>
      <div class="rid num" id="meRiot">—</div>
      <div class="rank" id="meRank">—</div>
      <div class="roles" id="meRoles"></div>
    </div>
  </div>

  <!-- メニュー -->
  <div class="sec">
    <div class="pops">

      <a class="pop" href="boards.html" style="--tint:var(--pink)">
        <div class="ico">🏆</div>
        <div class="pt">大会</div>
        <div class="pd">リーダーボード。組卓・順位入力・全体順位。</div>
        <div class="meta" id="boardMeta">読み込み中…</div>
      </a>

      <a class="pop soon" href="schedule.html" style="--tint:var(--cyan)">
        <span class="soon-tag">準備中</span>
        <div class="ico">🗓</div>
        <div class="pt">予定表</div>
        <div class="pd">大会・合宿・コーチングの日程をまとめて確認。</div>
        <div class="meta">近日公開</div>
      </a>

      <a class="pop soon" href="members.html" style="--tint:var(--violet)">
        <span class="soon-tag">準備中</span>
        <div class="ico">👥</div>
        <div class="pt">メンバー紹介</div>
        <div class="pd">校のメンバーのプロフィールとロール。</div>
        <div class="meta">近日公開</div>
      </a>

      <a class="pop soon" href="lp.html" style="--tint:var(--gold)">
        <span class="soon-tag">準備中</span>
        <div class="ico">📈</div>
        <div class="pt">LPランキング</div>
        <div class="pd">メンバーのランクとLPを一覧で比較。</div>
        <div class="meta">近日公開</div>
      </a>

    </div>
  </div>

  <!-- ツール -->
  <div class="sec" id="toolsSec" style="display:none">
    <div class="sec-head"><h2>🧰 ツール</h2></div>
    <div class="grid" id="tools"></div>
  </div>

</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="home-common.js"></script>
<script>
(function(){
  const C = window.LBCore;
  const CFG = window.MCC_LB_CONFIG || {};
  const $ = id => document.getElementById(id);
  const H = window.MCCHome;

  const session = C.Session.require();
  if (!session) return;
  const ctx = H.boot(session);

  /* 大会の件数をタイルに出す */
  C.listAllBoards().then(list => {
    const visible = list.filter(b => C.canViewBoard(b.visibility, session));
    $("boardMeta").textContent = visible.length
      ? ("参加できる大会 " + visible.length + "件 →")
      : (ctx.isAdmin ? "まだありません。作成する →" : "まだありません →");
  }).catch(() => { $("boardMeta").textContent = "開く →"; });

  /* ツール（config.js の home.tools） */
  const tools = ((CFG.home || {}).tools) || [];
  if (tools.length){
    const box = $("tools");
    let shown = 0;
    tools.forEach(t => {
      if (t.roleIds && t.roleIds.length && !ctx.isAdmin){
        const ok = ctx.roles.some(r => t.roleIds.includes(String(r.id)));
        if (!ok) return;
      }
      shown++;
      const a = document.createElement("a");
      a.className = "tcard";
      a.href = t.url || "#";
      if (t.external){ a.target = "_blank"; a.rel = "noopener"; }
      const ic = document.createElement("div");
      ic.className = "ico";
      ic.textContent = t.icon || "🔗";
      const d = document.createElement("div");
      const tt = document.createElement("div");
      tt.className = "tt";
      tt.textContent = t.name || t.url;
      d.appendChild(tt);
      if (t.desc){
        const td = document.createElement("div");
        td.className = "td";
        td.textContent = t.desc;
        d.appendChild(td);
      }
      a.appendChild(ic); a.appendChild(d);
      box.appendChild(a);
    });
    if (shown) $("toolsSec").style.display = "";
  }
})();
</script>
</body>
</html>
