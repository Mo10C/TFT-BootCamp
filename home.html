<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HOME ｜ クラウドハッシュテイル校 TOOLS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7CA455">
<meta name="description" content="クラウドハッシュテイル校 TOOLS — Discordログイン式の総合ホーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=5.2">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ---- タイルの中身（「遊び場」など）をHOMEの中で開く ----
   .pops はグリッドなので、1行ぜんぶを使うとタイルの真下に開く。 */
.kids{grid-column:1/-1;display:none;border-radius:20px;overflow:hidden;
  border:1.5px solid color-mix(in srgb,var(--tint,var(--accent)) 42%,var(--border));
  background:color-mix(in srgb,var(--tint,var(--accent)) 7%,var(--surface));
  box-shadow:var(--shadow-soft);animation:kidsin .22s cubic-bezier(.2,.9,.3,1)}
.kids.open{display:block}
@keyframes kidsin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.kids-head{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:12.5px;
  color:var(--muted);
  background:color-mix(in srgb,var(--tint,var(--accent)) 13%,var(--surface));
  border-bottom:1.5px solid color-mix(in srgb,var(--tint,var(--accent)) 26%,var(--border))}
.kids-head b{color:color-mix(in srgb,var(--tint,var(--accent)) 80%,var(--ink));font-size:13.5px}
.kids-close{margin-left:auto;border:1.5px solid var(--border-strong);background:var(--surface);
  border-radius:999px;padding:3px 12px;font-size:11px;font-weight:900;color:var(--muted)}
.kids-close:hover{border-color:var(--tint,var(--accent))}
.kids-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px;padding:14px 16px 16px}
.kid{display:flex;align-items:flex-start;gap:11px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:15px;padding:12px 14px;
  transition:transform .12s,border-color .12s,box-shadow .12s}
.kid-tx{min-width:0;flex:1}
.kid:hover{transform:translateY(-2px);border-color:var(--tint,var(--accent));box-shadow:var(--shadow-soft)}
.kid.unset{opacity:.6;cursor:default}
.kid.unset:hover{transform:none;border-color:var(--border);box-shadow:none}
.kid-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;
  background:color-mix(in srgb,var(--tint,var(--accent)) 15%,var(--surface));
  border:1.5px solid color-mix(in srgb,var(--tint,var(--accent)) 34%,var(--border))}
.kid-nm{font-size:13.5px;font-weight:900;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid-d{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.kid-go{margin-top:5px;font-size:10.5px;font-weight:900;white-space:nowrap;
  color:color-mix(in srgb,var(--tint,var(--accent)) 78%,var(--ink))}
.kid.unset .kid-go{color:var(--muted)}
.kids-empty{grid-column:1/-1;padding:18px 4px;text-align:center;font-size:12px;
  color:var(--muted);line-height:1.9}
/* 開いているタイルは押し込まれたように見せる */
.pop.opened{border-color:var(--tint,var(--accent));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tint,var(--accent)) 28%,transparent)}
.pop[data-kids] .meta::after{content:" ▾"}
.pop.opened .meta::after{content:" ▴"}
/* リンク先が未設定のタイル */
.pop.unset{opacity:.66;cursor:default}
.pop.unset:hover{transform:none;border-color:var(--border);box-shadow:var(--shadow-pop)}
@media (prefers-reduced-motion:reduce){
  .kids{animation:none}
  .kid:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="brandmark"><img src="assets/emblem.png" alt="クラウドハッシュテイル校" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>
      <div>
        <h1 id="homeTitle">クラウドハッシュテイル校 TOOLS</h1>
        <div class="sub" id="homeSub">Discordログイン式ホーム</div>
      </div>
    </div>
    <span class="badge" id="roleBadge">—</span>
    <div class="spacer"></div>
    <a class="iconbtn" id="editorLink" href="editor.html" style="display:none">⚙️ 管理</a>
    <button class="iconbtn" id="logoutBtn">ログアウト</button>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>

  <!-- 自分 -->
  <div class="mecard">
    <img id="meAvatar" alt="">
    <div class="who">
      <div class="nm" id="meName">—</div>
      <div class="rid num" id="meRiot">—</div>
      <div class="rid num" id="meDid" style="cursor:pointer" title="クリックでコピー"></div>
      <div class="rank" id="meRank">—</div>
      <div class="roles" id="meRoles"></div>
    </div>
  </div>

  <!-- メニュー -->
  <div class="sec">
    <div class="pops" id="pops"></div>
  </div>

  <!-- ツール -->
  <div class="sec" id="toolsSec" style="display:none">
    <div class="sec-head"><h2>🧰 ツール</h2></div>
    <div class="grid" id="tools"></div>
  </div>

</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="core.js?v=5.2"></script>
<script src="home-common.js?v=5.2"></script>
<script>
(function(){
  const C = window.LBCore;
  const CFG = window.MCC_LB_CONFIG || {};
  const $ = id => document.getElementById(id);
  const H = window.MCCHome;

  const session = C.Session.require();
  if (!session) return;
  const ctx = H.boot(session);

  /* 自分の Discord ユーザー名とID（config.js の admins に入れる値）。
     Discord アプリで開発者モードをONにして探さなくても、ここからコピーできる。 */
  (function(){
    const el = $("meDid");
    const d = session.discord || {};
    if (!d.id) return;
    el.textContent = "@" + (d.username || "?") + " ・ ID: " + d.id;
    el.onclick = () => {
      const copy = t => {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
        const ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta);
        return Promise.resolve();
      };
      copy(d.id).then(() => ctx.toast("ユーザーIDをコピーしました: " + d.id));
    };
  })();

  let boardMetaEl = null;

  /* アイコン。画像があれば画像、無ければ絵文字。
     画像の読み込みに失敗したときも絵文字に戻すので、白いマスにはならない。 */
  function iconEl(t){
    const ic = document.createElement("div");
    const src = String(t.img || "");
    if (!src || src === "none"){
      ic.className = "ico";
      ic.textContent = t.icon;
      return ic;
    }
    ic.className = "ico img";
    const im = document.createElement("img");
    im.src = src;
    im.alt = "";
    im.onerror = function(){
      ic.className = "ico";
      ic.textContent = t.icon;
    };
    ic.appendChild(im);
    return ic;
  }

  /* タイルの中に入るリンクカード（「遊び場」の中身）を、HOMEの中でその場に開く。
     .pops はグリッドなので、パネルに grid-column:1/-1 を当てると
     ちょうどそのタイルの下の行いっぱいに広がる。 */
  function kidsPanel(t){
    const wrap = document.createElement("div");
    wrap.className = "kids";
    wrap.id = "kids-" + t.id;
    wrap.style.setProperty("--tint", "var(--" + t.tint + ")");

    const head = document.createElement("div");
    head.className = "kids-head";
    head.innerHTML = "<b>" + escapeHtml(t.name) + "</b> の中身";
    const close = document.createElement("button");
    close.className = "kids-close";
    close.textContent = "✕ 閉じる";
    close.onclick = () => toggleKids(t.id, false);
    head.appendChild(close);
    wrap.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "kids-grid";
    const kids = (t.children || []).filter(k => C.canSeeEntry(k, session));
    if (!kids.length){
      grid.innerHTML = '<div class="kids-empty">まだ何も入っていません。' +
        '管理コンソール →「🏠 HOME編集」から中のリンクを追加できます。</div>';
    }
    kids.forEach(k => {
      const unset = C.noLink(k.url);
      const a = document.createElement(unset ? "div" : "a");
      a.className = "kid" + (unset ? " unset" : "");
      if (!unset){
        a.href = k.url;
        if (k.external){ a.target = "_blank"; a.rel = "noopener"; }
      }
      const ic = document.createElement("div");
      ic.className = "kid-ico";
      ic.textContent = k.icon || "🔗";
      const tx = document.createElement("div");
      tx.className = "kid-tx";
      const nm = document.createElement("div");
      nm.className = "kid-nm";
      nm.textContent = k.name;
      tx.appendChild(nm);
      if (k.desc){
        const d = document.createElement("div");
        d.className = "kid-d";
        d.textContent = k.desc;
        tx.appendChild(d);
      }
      const go = document.createElement("div");
      go.className = "kid-go";
      go.textContent = unset ? "リンク先が未設定" : (k.external ? "開く ↗" : "開く →");
      tx.appendChild(go);
      a.appendChild(ic); a.appendChild(tx);
      grid.appendChild(a);
    });
    wrap.appendChild(grid);
    return wrap;
  }
  function toggleKids(id, on){
    const el = document.getElementById("kids-" + id);
    const tile = document.querySelector('.pop[data-kids="' + id + '"]');
    if (!el) return;
    const open = (on == null) ? !el.classList.contains("open") : on;
    // ひとつ開いたら、ほかは閉じる
    document.querySelectorAll(".kids.open").forEach(x => x.classList.remove("open"));
    document.querySelectorAll(".pop.opened").forEach(x => x.classList.remove("opened"));
    if (open){
      el.classList.add("open");
      if (tile) tile.classList.add("opened");
    }
  }
  function escapeHtml(x){
    return String(x == null ? "" : x).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function renderTiles(home){
    $("homeTitle").textContent = home.title;
    $("homeSub").textContent = home.subtitle;
    document.title = home.title.slice(0, 30) + " ｜ HOME";

    const box = $("pops");
    box.innerHTML = "";
    home.tiles.forEach(t => {
      if (!t.enabled) return;
      if (!C.canSeeEntry(t, session)) return;

      const hasKids = (t.children || []).length > 0;
      // リンク先が未設定のタイルは、押しても飛ばさず「未設定」と出す
      const unset = !hasKids && C.noLink(t.url);
      const a = document.createElement(unset ? "div" : "a");
      a.className = "pop" + (t.soon ? " soon" : "") + (unset ? " unset" : "");
      if (!unset && !hasKids){
        a.href = t.url;
        if (t.external){ a.target = "_blank"; a.rel = "noopener"; }
      }
      if (hasKids) a.dataset.kids = t.id;
      a.style.setProperty("--tint", "var(--" + t.tint + ")");

      if (t.soon){
        const tag = document.createElement("span");
        tag.className = "soon-tag";
        tag.textContent = "準備中";
        a.appendChild(tag);
      }
      const ic = iconEl(t);
      const nm = document.createElement("div");
      nm.className = "pt";
      nm.textContent = t.name;
      const de = document.createElement("div");
      de.className = "pd";
      de.textContent = t.desc;
      const me = document.createElement("div");
      me.className = "meta";
      me.textContent = t.soon ? "近日公開"
        : hasKids ? ("中を見る（" + t.children.length + "つ）")
        : unset ? "リンク先が未設定です"
        : (t.external ? "開く ↗" : "開く →");
      a.appendChild(ic); a.appendChild(nm); a.appendChild(de); a.appendChild(me);
      box.appendChild(a);

      if (hasKids){
        a.style.cursor = "pointer";
        a.onclick = e => { e.preventDefault(); toggleKids(t.id); };
        box.appendChild(kidsPanel(t));
      }

      // 大会タイルだけ件数を出す
      if (t.url && t.url.indexOf("boards.html") === 0 && !t.soon){
        me.textContent = "読み込み中…";
        boardMetaEl = me;
      }
    });

    if (boardMetaEl){
      C.listAllBoards().then(list => {
        const visible = list.filter(b => C.canViewBoard(b.visibility, session));
        boardMetaEl.textContent = visible.length
          ? ("参加できる大会 " + visible.length + "件 →")
          : (ctx.isAdmin ? "まだありません。作成する →" : "まだありません →");
      }).catch(() => { boardMetaEl.textContent = "開く →"; });
    }
  }

  function renderTools(home){
    const box = $("tools");
    box.innerHTML = "";
    let shown = 0;
    home.tools.forEach(t => {
      if (!C.canSeeEntry(t, session)) return;
      shown++;
      const a = document.createElement("a");
      a.className = "tcard";
      a.href = t.url || "#";
      if (t.external){ a.target = "_blank"; a.rel = "noopener"; }
      const ic = iconEl(t);
      const d = document.createElement("div");
      const tt = document.createElement("div");
      tt.className = "tt";
      tt.textContent = t.name;
      d.appendChild(tt);
      if (t.desc){
        const td = document.createElement("div");
        td.className = "td";
        td.textContent = t.desc;
        d.appendChild(td);
      }
      a.appendChild(ic); a.appendChild(d);
      box.appendChild(a);
    });
    $("toolsSec").style.display = shown ? "" : "none";
  }

  /* ---- core.js が古いと関数が無く、ここで落ちてタイルが1枚も出ない。
         黙って白画面にせず、原因と対処を画面に出す。---- */
  const NEED = ["cachedHomeConfig", "homeConfigKey", "defaultHomeConfig", "loadHomeConfig", "canSeeEntry"];
  const missing = NEED.filter(k => typeof C[k] !== "function");
  if (missing.length){
    const box = $("pops");
    box.innerHTML =
      '<div class="empty" style="grid-column:1/-1;text-align:left;line-height:1.8">' +
      '<b style="color:var(--gold)">⚠️ core.js が古いバージョンです</b><br>' +
      'このページが必要とする機能がありません（' + missing.join(", ") + '）。<br><br>' +
      '<b>対処</b><br>' +
      '① 最新の <code>core.js</code> をアップロードしているか確認<br>' +
      '② <b>Ctrl/⌘ + Shift + R</b> でスーパーリロード（ブラウザのキャッシュが原因のことが多いです）<br><br>' +
      '<span style="color:var(--muted);font-size:11.5px">読み込まれている core.js: ' +
      (C.VERSION ? "v" + C.VERSION : "バージョン表記なし（v2.6以前）") + ' ／ このページの想定: v3.4 以降</span>' +
      '</div>';
    console.error("[HOME] core.js が古いため描画を中止しました。不足:", missing);
    return;
  }

  /* 初回描画は「前回このブラウザで見た内容」から行う。
     こうしないと Firestore の応答を待つ間、既定の並び順が一瞬見えてしまう。
     取得後、内容が実際に変わっていたときだけ描き直す（updatedAt の差では描き直さない）。 */
  let shown = C.cachedHomeConfig() || C.defaultHomeConfig();
  renderTiles(shown);
  renderTools(shown);

  C.loadHomeConfig().then(home => {
    if (C.homeConfigKey(home) === C.homeConfigKey(shown)) return;  // 変化なし＝描き直さない
    shown = home;
    boardMetaEl = null;
    renderTiles(home);
    renderTools(home);
  }).catch(e => console.warn("HOME設定", e));
})();
</script>
</body>
</html>
