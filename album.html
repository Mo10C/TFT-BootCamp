<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>卒業証書 ｜ クラウドハッシュテイル校 TOOLS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7CA455">
<meta name="description" content="クラウドハッシュテイル校 卒業証書 — 合宿の歩みを1人1ページに">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<!-- 「卒業証書」の達筆な文字（毛筆体 Yuji Boku）。使う4文字だけを読み込むので軽い -->
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&text=%E5%8D%92%E6%A5%AD%E8%A8%BC%E6%9B%B8&display=swap" rel="stylesheet" id="brushFont">
<link rel="stylesheet" href="ui.css?v=5.3">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--al:var(--leaf)}
/* ---- 達筆（毛筆体）。書体を変えたいときは --brush だけ差し替える ---- */
:root{--brush:"Yuji Boku","Zen Kaku Gothic New",serif}
.brush{font-family:var(--brush);font-weight:400;letter-spacing:.14em}

.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow-soft);overflow:hidden;margin-bottom:16px}
.pbody{padding:18px 20px}
.spacer{flex:1}
.empty{padding:34px 18px;text-align:center;font-size:13px;color:var(--muted);line-height:1.9}
.note{font-size:11.5px;color:var(--muted);line-height:1.8}
.num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.xbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border-strong);background:var(--surface);
  color:var(--ink);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:900;cursor:pointer;
  font-family:inherit;text-decoration:none;transition:transform .1s,border-color .1s,box-shadow .1s}
.xbtn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--al);box-shadow:var(--shadow-soft)}
.xbtn:disabled{opacity:.45;cursor:default}
.xbtn.main{background:var(--al);border-color:transparent;color:#fff}
.xrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- 表紙 ---- */
.cover{position:relative;padding:30px 24px 26px;text-align:center;
  background:
    radial-gradient(420px 180px at 12% 0%,color-mix(in srgb,var(--leaf) 26%,transparent),transparent 70%),
    radial-gradient(420px 200px at 92% 10%,color-mix(in srgb,var(--sky) 22%,transparent),transparent 70%),
    var(--surface)}
.cover .kicker{font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--leaf)}
.cover h1{font-size:46px;font-weight:400;margin:8px 0 6px;line-height:1.2}
.cover .period{font-family:"Space Grotesk",sans-serif;font-size:13px;color:var(--muted);letter-spacing:.08em}
.cover .msg{max-width:620px;margin:16px auto 0;font-size:13px;line-height:1.95;white-space:pre-wrap;text-align:left;
  background:color-mix(in srgb,var(--leaf) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--leaf) 45%,var(--border));
  border-radius:14px;padding:14px 18px}
.cover .msg .sig{display:block;text-align:right;font-weight:900;margin-top:6px;color:var(--leaf)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;border-radius:14px;margin-bottom:14px;
  font-size:12.5px;line-height:1.7;background:color-mix(in srgb,var(--gold) 14%,var(--surface));
  border:1.5px solid color-mix(in srgb,var(--gold) 45%,var(--border))}

/* ---- 一覧 ---- */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--leaf);color:var(--ink);background:color-mix(in srgb,var(--leaf) 14%,var(--surface))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 12px 14px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:18px;cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .12s,border-color .12s,box-shadow .12s;position:relative}
.st:hover{transform:translateY(-2px);border-color:var(--c,var(--leaf));box-shadow:var(--shadow-soft)}
.st.me{border-color:var(--c,var(--leaf));box-shadow:inset 0 0 0 1.5px var(--c,var(--leaf))}
.st .you{position:absolute;top:10px;right:10px;font-size:10px;font-weight:900;padding:1px 8px;border-radius:99px;
  background:var(--gold);color:#fff}
.av{border-radius:999px;object-fit:cover;background:var(--surface-2);border:3px solid var(--c,var(--leaf));flex:none}
.avf{display:grid;place-items:center;font-weight:900;color:#fff;background:var(--c,var(--leaf))}
.st .av{width:76px;height:76px}
.st .nm{font-size:14.5px;font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .ro{font-size:10.5px;color:var(--muted)}
.st .jr{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--muted);min-height:34px}
.st .gain{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15px}
.up{color:var(--ok)} .down{color:var(--danger)} .flat{color:var(--muted)}

/* ---- 1人のページ ---- */
.page{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:24px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
/* 入学許可書と同じ：紙の地・金の二重枠・四すみの飾り・朱印（ダークモードでも読めるよう色は混ぜて作る） */
.page{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 7%,var(--surface)),
  color-mix(in srgb,var(--leaf) 6%,var(--surface)) 60%,color-mix(in srgb,var(--sky) 9%,var(--surface)));
  border:4px solid #C9A24A;border-radius:20px}
.page::before{content:"";position:absolute;inset:9px;border:1.5px solid #E8CD82;border-radius:13px;pointer-events:none;z-index:0}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 9px 9px,#C9A24A 5px,transparent 5.5px),
    radial-gradient(circle at calc(100% - 9px) 9px,#C9A24A 5px,transparent 5.5px),
    radial-gradient(circle at 9px calc(100% - 9px),#C9A24A 5px,transparent 5.5px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#C9A24A 5px,transparent 5.5px)}
.page > *{position:relative;z-index:1}
.pg-hero .av{border-color:#D9B75E}
.seal{position:absolute;top:24px;right:28px;z-index:2;width:68px;height:68px;border:4px solid #C8372D;border-radius:8px;
  display:grid;place-items:center;transform:rotate(-5deg);color:#C8372D;font-family:var(--brush);font-size:20px;line-height:1.05;
  text-align:center;box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4.5px #C8372D;opacity:.92}
.hl .b,.bubble{background:color-mix(in srgb,var(--leaf) 10%,var(--surface))}
.pg-hero{padding-right:120px}
.tbody{font-size:16px;line-height:2.05;white-space:pre-wrap;font-weight:700;padding:4px 2px}
.pg-hero{position:relative;display:flex;gap:20px;align-items:center;padding:28px 26px 10px;flex-wrap:wrap}
.pg-hero .av{width:118px;height:118px;border-width:5px;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
.pg-hero .avf{font-size:40px}
.pg-hero .kicker{font-size:28px;line-height:1.2;color:var(--ink)}
.pg-hero h2{font-size:30px;font-weight:900;line-height:1.25;margin:2px 0}
.pg-hero .sub{font-size:12px;color:var(--muted)}
.pg-hero .role{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;padding:2px 10px;border-radius:99px;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 40%,var(--border))}
.pg-sec{position:relative;padding:14px 26px}
.pg-sec h3{font-size:11.5px;font-weight:900;letter-spacing:.14em;color:var(--c);margin-bottom:10px}
.journey{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.jr-pt{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:118px}
.jr-pt small{font-size:10.5px;color:var(--muted);font-weight:700}
.jr-pt .rk{font-size:13px;font-weight:900;white-space:nowrap}
.jr-pt .rkico{--rk-lg:2.8em}
.jr-arrow{font-size:22px;color:var(--muted)}
.jr-gain{margin-left:auto;text-align:right}
/* ---- 寄せ書き（ふせん） ---- */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:4px}
.nt{position:relative;padding:16px 16px 12px;border-radius:6px 6px 16px 6px;color:#3A3226;min-height:100px;
  box-shadow:0 6px 16px -10px rgba(0,0,0,.45);transform:rotate(var(--r,0deg))}
.nt p{font-family:"Klee One","Zen Kaku Gothic New",sans-serif;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;margin:0}
.nt .by{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px;font-size:12px;font-weight:900;color:#3A3226;text-decoration:none}
.nt .by .av{width:22px;height:22px;border-width:2px;border-color:rgba(255,255,255,.8)}
.nt .by .avf{font-size:10px}
.nt::before{content:"";position:absolute;top:-7px;left:50%;width:56px;height:14px;transform:translateX(-50%) rotate(-2deg);
  background:rgba(255,255,255,.55);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pg-sec a.role.mentor-chip{font-size:12px;font-weight:900;border:1.5px solid;border-radius:99px}
a.role.mentor-chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:rgba(201,162,74,.18);border-color:rgba(201,162,74,.45);color:#9A7426;padding:3px 12px 3px 4px;vertical-align:middle}
a.role.mentor-chip .av{width:24px;height:24px;border-width:2px;border-color:#D9B75E;margin:0}
a.role.mentor-chip .avf{font-size:11px;display:inline-grid;place-items:center}
.jr-who{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);margin-right:6px}
.jr-who .av{width:96px;height:96px;border-width:4px;border-color:#D9B75E;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.jr-who .avf{font-size:32px}
.jr-who b{font-size:14px;font-weight:900;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-who:hover .av{transform:scale(1.04)}
.jr-gain .v{font-family:"Space Grotesk",sans-serif;font-size:40px;font-weight:700;line-height:1}
.jr-gain small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.spark{margin-top:12px;width:100%;height:84px;display:block}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hl .b{border:1.5px solid var(--border);border-radius:14px;padding:11px 13px;background:var(--surface)}
.hl .b small{display:block;font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.hl .b b{display:block;font-size:17px;font-weight:900;margin-top:2px;line-height:1.35}
.hl .b span{display:block;font-size:10.5px;color:var(--muted)}
.mates{display:flex;gap:14px;flex-wrap:wrap}
.mate{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--border);
  background:var(--surface);text-decoration:none;color:inherit}
.mate:hover{border-color:var(--c)}
.mate .av{width:38px;height:38px;border-width:2px}
.mate .avf{font-size:14px}
.mate b{font-size:13px;display:block}
.mate small{font-size:10.5px;color:var(--muted)}
.bubble{position:relative;border-radius:18px;padding:16px 20px;font-size:14px;line-height:1.95;white-space:pre-wrap;
  background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 38%,var(--border))}
.bubble .sig{display:block;text-align:right;font-size:12px;font-weight:900;color:var(--c);margin-top:4px}
.pg-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 26px 22px;border-top:1px dashed var(--border-strong);margin-top:8px}
.pg-nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.shot{margin-top:14px}
/* 証書（1200×675の画像そのもの）を1人ページの一番上に出す */
.cert{position:relative;margin:0 0 14px;border-radius:16px;overflow:hidden;aspect-ratio:1200/675;
  background:#FBF8EE;box-shadow:0 10px 30px rgba(35,56,77,.14)}
.cert img{display:block;width:100%;height:100%}
.cert.tall{aspect-ratio:1080/1350;max-width:620px;margin-left:auto;margin-right:auto}
.cert .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:#6D8699}
.page.after-cert{padding-top:8px}
/* 管理画面に埋め込むとき（album.html?id=…&embed=cert）は証書だけ */
body.embed{background:transparent!important;min-height:0}
body.embed .top,body.embed #toast{display:none!important}
body.embed .wrap{max-width:none!important;padding:0!important;margin:0!important}
body.embed .cert{margin:0;border-radius:0;box-shadow:none}
.shot img{width:100%;border-radius:14px;border:1px solid var(--border);display:block}


/* ---- 特別賞 ---- */
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.aw{position:relative;border-radius:18px;padding:16px 18px;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--surface)),var(--surface) 70%);
  border:1.5px solid color-mix(in srgb,var(--gold) 55%,var(--border))}
.aw .ic{font-size:30px;line-height:1}
.aw b{display:block;font-size:17px;font-weight:900;margin-top:6px}
.aw p{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:2px}
.aw .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.aw .who a{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);font-size:12px;font-weight:900;color:inherit;text-decoration:none}
.aw .who .av{width:24px;height:24px;border-width:2px}
.aw .who .avf{font-size:11px}
.sec-t{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--gold);margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-t small{letter-spacing:0;color:var(--muted);font-weight:700}
.st.pend{opacity:.72;border-style:dashed}
.st .pendb{position:absolute;bottom:8px;right:8px;font-size:10px;font-weight:900;padding:1px 8px;border-radius:99px;background:var(--muted,#888);color:#fff}
.st .awb{position:absolute;top:10px;left:10px;font-size:18px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.pg-awards{display:flex;flex-wrap:wrap;gap:10px}
.pg-aw{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:16px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 26%,var(--surface)),var(--surface));
  border:1.5px solid color-mix(in srgb,var(--gold) 60%,var(--border))}
.pg-aw .ic{font-size:30px;line-height:1}
.pg-aw b{display:block;font-size:17px;font-weight:900}
.pg-aw small{display:block;font-size:11px;color:var(--muted)}
.pending{font-size:10.5px;font-weight:900;color:var(--gold);margin-left:4px}
.editlink{margin-left:auto;font-size:11.5px;font-weight:900;text-decoration:none;color:var(--muted);
  border:1px dashed var(--border-strong);border-radius:999px;padding:3px 10px}
.editlink:hover{color:var(--ink);border-color:var(--c)}

@media (max-width:620px){
  .seal{width:50px;height:50px;font-size:15px;top:16px;right:18px}
  .pg-hero{padding:22px 76px 6px 18px}
  .pg-hero .av{width:92px;height:92px}
  .pg-hero h2{font-size:24px}
  .pg-sec{padding:12px 18px}
  .jr-gain{margin-left:0;text-align:left;width:100%}
  .jr-gain .v{font-size:32px}
  .pg-foot{padding:14px 18px 18px}
  .cover h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="brandmark"><img src="assets/emblem.png" alt="クラウドハッシュテイル校" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>
      <div>
        <h1>卒業証書</h1>
        <div class="sub">クラウドハッシュテイル校 TOOLS</div>
      </div>
    </div>
    <span class="badge" id="roleBadge">—</span>
    <div class="spacer"></div>
    <a class="iconbtn" href="home.html">🏠 HOME</a>
    <a class="iconbtn" id="editorLink" href="editor.html" style="display:none">⚙️ 管理</a>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>

  <div id="view"><div class="panel"><div class="empty">卒業証書をひらいています…</div></div></div>

</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="core.js?v=5.3"></script>
<script src="home-common.js?v=5.3"></script>
<script>
(function(){
  "use strict";
  const C = window.LBCore;
  const $ = id => document.getElementById(id);

  if (!C || typeof C.albumEntry !== "function"){
    document.body.innerHTML =
      '<div style="max-width:560px;margin:16vh auto;padding:30px;text-align:center;font-family:sans-serif;line-height:1.9">' +
      '<b style="color:#D3860A">⚠️ core.js が古いバージョンです</b><br><br>' +
      '卒業証書に対応した core.js に差し替えて、強制リロード（Ctrl/⌘ + Shift + R）してください。</div>';
    return;
  }
  const session = C.Session.require();
  if (!session) return;
  const ctx = window.MCCHome ? window.MCCHome.boot(session) : null;
  const toast = m => (ctx && ctx.toast ? ctx.toast(m) : alert(m));
  const IS_ADMIN = C.isAdmin(session);
  const ME = "u_" + session.discord.id;
  if (IS_ADMIN) $("editorLink").style.display = "";
  // 管理画面の「卒業証書」タブのプレビュー用（証書の画像だけを出す）
  const EMBED_KIND = new URLSearchParams(location.search).get("embed");   // cert＝証書／sum＝まとめ画像
  const EMBED = IS_ADMIN && (EMBED_KIND === "cert" || EMBED_KIND === "sum");
  if (EMBED) document.body.classList.add("embed");

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const md = k => k ? (Number(k.slice(5, 7)) + "/" + Number(k.slice(8))) : "";
  const ymd = k => k ? k.replace(/-/g, ".") : "";
  const hours = s => { const h = (s || 0) / 3600; return h >= 10 ? Math.round(h) : Math.round(h * 10) / 10; };
  const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v | 0);

  /* ---- テーマ色（プロフィールで選んだ色。無ければ校のイメージカラー＝薄い緑） ---- */
  const THEMES = {};
  (C.PROFILE_THEMES || []).forEach(t => { THEMES[t.id] = t.css; });
  // canvas では CSS 変数が使えないので、実際の色に直す
  function cssColor(v){
    const el = document.createElement("span");
    el.style.color = v; el.style.display = "none";
    document.body.appendChild(el);
    const c = getComputedStyle(el).color;
    el.remove();
    return c || "#85A856";
  }

  let D = null;   // 読み込んだデータ一式
  // 特別賞を見せるか（発表前は管理者だけ）
  const showAwards = () => D.album.awardsOpen || IS_ADMIN;
  const pendingTag = () => D.album.awardsOpen ? "" : '<span class="pending">（未発表・管理者にだけ見えています）</span>';

  function ensureBrush(text){
    const t = Array.from(new Set(String(text || "") + "卒業証書感謝状之印殿師弟之証")).join("");
    const l = $("brushFont");

  let RAW = null;   // 読み込んだ記録（プレビューで文言だけ変えたときは読み直さない）
  async function loadAll(override){

    const S = album.start, E = album.end;
    const safe = p => p.catch(e => { console.warn(e); return null; });

      C.loadLpData(), safe(C.loadSnapshot()), safe(C.loadExamScores()),
      safe(C.loadVcRange(S, E)), safe(C.loadVcCompanions(S, E)), safe(C.loadProfileCards()), safe(C.loadMembers()),
      safe(C.loadYosegaki ? C.loadYosegaki() : Promise.resolve({})),
      // 感謝ワード（チャットで「ありがとう」などを言った回数）。管理画面で外したチャンネルは数えない
      safe(C.loadThanksConfig ? C.loadThanksConfig().then(c => C.loadThanksRange(S, E, c.exclude)) : Promise.resolve(null)),
      safe(C.loadCampGames ? C.loadCampGames() : Promise.resolve({}))
    ]);
    RAW = { key: rawKey, v: raw };
    const [lp, snap, exam, vcr, vcc, cards, members, yose, thx, games] = raw;
    const mem = members || {};
    // 講師＝「講師（先生）のロール」を持っている人（管理コンソール →「入学許可書」で選ぶ）

    const isT = id => C.isTeacherOf((lp.members || {})[id], teacherRoles) || C.isTeacherOf(mem[id], teacherRoles);
    const order = C.lpGroupOrder(lp);
    const extra = { snap, exam, vcUsers: vcr ? vcr.users : [], vcComp: vcc, thanksUsers: thx ? thx.users : [], games: games || {} };
    // アイコンの予備（LPの名簿とメンバー名簿で違うURLが入っていたら、もう片方も試す）
    const altAv = (cur, lm, mm) => [lm.avatar, mm.discord && mm.discord.avatar].filter(u => u && u !== cur)[0] || "";
    // 生徒＝LPランキングの名簿＋メンバー名簿の参加者（講師・運営は除く）
    const sIds = Array.from(new Set(Object.keys(lp.members || {}).concat(
      Object.keys(mem).filter(id => !C.isParticipant || C.isParticipant(mem[id]))))).filter(id => !isT(id));
    const allStu = sIds.map(id => {
      const e = C.albumEntry(lp, id, album, extra);
      const lm = (lp.members || {})[id] || {}, mm = mem[id] || {};
      e.name = lm.name || mm.name || "—";
      e.avatar = lm.avatar || (mm.discord && mm.discord.avatar) || "";
      e.avatarAlt = altAv(e.avatar, lm, mm);
      const gi = C.lpGroupIndex((lp.members || {})[id] || mm, order);

      const card = cards && cards[id];
      e.color = card && THEMES[card.theme.color] ? THEMES[card.theme.color] : "var(--leaf)";
      e.pending = !(e.start || e.vc || e.exam || e.snap);   // 期間中の記録がまだ無い
      return e;
    });
    // 生徒には「期間中に何かしら記録がある人」だけ。管理者には記録待ちの人も全員出す
    const list = IS_ADMIN ? allStu : allStu.filter(e => !e.pending);

    /* ---- 講師（感謝状） ---- */
    const mentors = album.mentors || {};
    const TIERS = ["IRON","BRONZE","SILVER","GOLD","PLATINUM","EMERALD","DIAMOND","MASTER","GRANDMASTER","CHALLENGER"];
    const ti = r => r ? TIERS.indexOf(r.tier) : -1;
    const tIds = Array.from(new Set(Object.keys(lp.members || {}).concat(Object.keys(mem)))).filter(isT);
    const teachers = tIds.map(id => {
      const e = C.albumEntry(lp, id, album, extra);
      const lm = (lp.members || {})[id] || {}, mm = mem[id] || {};
      e.name = lm.name || mm.name || "—";

      e.avatarAlt = altAv(e.avatar, lm, mm);
      e.teacher = true;
      e.roleLabel = "講師";
      const card = cards && cards[id];
      e.color = card && THEMES[card.theme.color] ? THEMES[card.theme.color] : "var(--gold)";
      const comp = (vcc && vcc.byUser && vcc.byUser[id]) || {};
      // 担当の生徒（先生1人につき生徒1人）
      const s = allStu.find(x => mentors[x.id] === id) || null;
      e.t = { s, vcSec: s ? (comp[s.id] || 0) : 0 };

    }).sort((a, b) => a.name.localeCompare(b.name, "ja"));

    /* コーチング時間：生徒が「担当の先生の名前が入ったVC」にいた時間（例：先生が「もと」なら「もと先生の部屋」）。

    const normN = t => String(t || "").toLowerCase().replace(/先生|せんせい|[\s\u3000・.,_\-|｜/()（）【】\[\]「」『』'"!！?？~〜#＃:：]/g, "");
    const vcUsers = vcr ? vcr.users || [] : [];

      const strict = chs.filter(c => keep(c.name).indexOf(key + "先生") >= 0 || keep(c.name).indexOf(key + "せんせい") >= 0);
      const hit = strict.length ? strict : chs.filter(c => normN(c.name).indexOf(key) >= 0);

    const avatarOf = id => (byId[id] && byId[id].avatar) || ((lp.members || {})[id] || {}).avatar ||

    D = { album, lp, list, teachers, byId, nameOf, avatarOf, avatarsOf, yoseTo };

  /* ================= 1人のページ ================= */
  function sparkSvg(e){
    const pts = e.series;
    if (!pts || pts.length < 2) return "";
    const W = 600, H = 84, P = 8;
    const vs = pts.map(p => p.v), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
    const span = Math.max(40, mx - mn);
    const x = i => P + i * (W - P * 2) / (pts.length - 1);
    const y = v => H - P - (v - mn) / span * (H - P * 2);
    const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    const area = d + " L" + x(pts.length - 1).toFixed(1) + " " + (H - P) + " L" + x(0).toFixed(1) + " " + (H - P) + " Z";
    const pi = vs.indexOf(mx);
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="期間中のLPの推移">' +
      '<path d="' + area + '" fill="var(--c)" opacity=".12"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + x(pi).toFixed(1) + '" cy="' + y(mx).toFixed(1) + '" r="4" fill="var(--gold)"/>' +
      "</svg>";
  }

  /* ================= テスト用のダミーデータ（管理者だけ） =================
     album.html?id=…&dummy=1 で、その人の名前・アイコンはそのままに、記録（LP・試合数・VC・仲間・特別賞など）を
     ダミーで埋めて表示する。id=__dummy_s（ダミーの生徒）／__dummy_t（ダミーの先生）なら人もダミー。
     管理コンソール →「卒業証書」→ プレビューの「ダミーデータ」で使う。保存はしない */
  const DUMMY = IS_ADMIN && new URLSearchParams(location.search).get("dummy") === "1";
  const dayAdd = (k, n) => new Date(Date.parse(k) + n * 864e5).toISOString().slice(0, 10);
  function dummySeries(seed){
    // エメラルドⅣ（2000）あたりから、上がったり下がったりしながらマスター（2800〜）へ
    let sd = 7 + seed, v = 2000 + (seed % 5) * 20;
    const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const S = D.album.start, total = Math.max(2, Math.round((Date.parse(D.album.end) - Date.parse(S)) / 864e5));
    const out = [{ day: dayAdd(S, -1), v }];
    for (let d = 1; d <= total; d += 1 + Math.floor(rnd() * 2)){
      v += Math.round(-35 + rnd() * 120);
      out.push({ day: dayAdd(S, d), v });
    }
    const last = out[out.length - 1]; if (last.v < 2840) last.v = 2840 + (seed % 7) * 10;
    return out;
  }
  function dummyStats(e, seed){
    const series = dummySeries(seed);
    const sA = series[0].v, eA = series[series.length - 1].v;
    let peak = series[0], best = null;
    series.forEach((p, i) => { if (p.v > peak.v) peak = p;
      if (i){ const dd = p.v - series[i - 1].v; if (!best || dd > best.delta) best = { day: p.day, delta: dd }; } });
    // いっしょに過ごした仲間：実際の名簿から（足りなければダミーの名前）
    const pool = D.list.concat(D.teachers).filter(x => x.id !== e.id && !/^__dummy/.test(x.id));
    const fake = ["ひよこ", "たまご", "くまだ", "Raimaru", "LemonJP"];
    const mates = [42, 31.5, 18, 9.2, 4].map((h, i) => pool[i]
      ? { id: pool[i].id, seconds: Math.round(h * 3600) }
      : { id: "__m" + i, name: fake[i], avatar: "", seconds: Math.round(h * 3600) });
    const mentorName = e.teacher ? e.name : (e.mentor ? e.mentor.name : "もと");
    return {
      start: { day: series[0].day, abs: sA, rank: C.rankOfAbs(sA) },
      end: { day: series[series.length - 1].day, abs: eA, rank: C.rankOfAbs(eA) },
      gain: eA - sA, series,
      peak: { day: peak.day, abs: peak.v, rank: C.rankOfAbs(peak.v) },
      bestDay: best && best.delta > 0 ? best : null,
      games: 58 + seed % 30, thanks: 40 + seed % 50,
      vc: { seconds: Math.round(86.5 * 3600), topChannel: { name: "もくもく作業部屋" }, mates },

  /* ================= 画像（1200×675） =================
     html2canvas などは使わず、canvas に直接描く。
     他サイトの画像（Discordのアイコン）は、読めなければ頭文字の丸にする
     （読めない画像を描くと、画像として保存できなくなるため）。 */
  function loadImg(src){
    return new Promise(res => {
      if (!src) return res(null);
      const im = new Image();
      if (!/^data:/.test(src)) {
        try { if (new URL(src, location.href).origin !== location.origin) im.crossOrigin = "anonymous"; } catch(e){}
      }
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = src;
    });
  }
  function rr(g, x, y, w, h, r){
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function fitText(g, t, maxW){
    t = String(t || "");
    if (g.measureText(t).width <= maxW) return t;
    while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  }
  /* 名前が見切れないように：文字を小さくして収める。最小でも入らなければ2行にする */
  function fitName(g, t, maxW, fsMax, fsMin, weight, family){
    t = String(t || "");
    let fs = fsMax;
    const set = () => { g.font = (weight || "900") + " " + fs + "px " + family; };
    set();
    while (fs > fsMin && g.measureText(t).width > maxW){ fs -= 1; set(); }
    if (g.measureText(t).width <= maxW) return { fs, lines: [t] };
    return { fs, lines: wrapText(g, t, maxW, 2) };
  }
  function wrapText(g, t, maxW, maxLines){
    const out = []; let line = "";
    for (const ch of String(t || "").replace(/\s*\n\s*/g, " ")){
      if (g.measureText(line + ch).width > maxW){ out.push(line); line = ch; if (out.length === maxLines) break; }
      else line += ch;
    }
    if (out.length < maxLines && line) out.push(line);
    if (out.length === maxLines && (out.join("").length < String(t).replace(/\s/g, "").length))
      out[maxLines - 1] = fitText(g, out[maxLines - 1] + "…", maxW);
    return out;
  }
  async function drawAvatar(g, url, name, cx, cy, r, ring){
    let im = null;
    for (const u of (Array.isArray(url) ? url : [url])){ im = await loadImg(u); if (im) break; }
    g.save();
    g.beginPath(); g.arc(cx, cy, r + (ring ? 6 : 3), 0, Math.PI * 2); g.fillStyle = ring || "#fff"; g.fill();
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.closePath(); g.clip();
    if (im){ g.drawImage(im, cx - r, cy - r, r * 2, r * 2); }
    else {
      g.fillStyle = ring || "#85A856"; g.fillRect(cx - r, cy - r, r * 2, r * 2);
      g.fillStyle = "#fff"; g.font = "900 " + Math.round(r * .9) + 'px "Zen Kaku Gothic New",sans-serif';
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(String(name || "?").slice(0, 1), cx, cy + 2);
    }
    g.restore();
  }
  async function drawRank(g, rank, x, y, h){
    if (!rank) return 0;
    const ov = C.rankIconOf(rank.tier);
    const im = ov && ov.img ? await loadImg(ov.img) : null;
    if (im){
      const k = h / im.naturalHeight, w = Math.min(h * 1.6, im.naturalWidth * k);
      const kk = w / im.naturalWidth;
      g.drawImage(im, x, y + (h - im.naturalHeight * kk) / 2, w, im.naturalHeight * kk);
      return w;
    }
    // 画像が無いティアは色つきの丸にする
    const col = cssColor(C.rankColor(rank));
    g.beginPath(); g.arc(x + h / 2, y + h / 2, h / 2 - 2, 0, Math.PI * 2); g.fillStyle = col; g.fill();
    g.fillStyle = "#fff"; g.font = "900 " + Math.round(h * .42) + 'px "Space Grotesk",sans-serif';
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(rank.tier).slice(0, 1), x + h / 2, y + h / 2 + 1);
    return h;
  }

  /* ================= 証書と合宿の記録の画像 =================
     ・卒業証書／感謝状（1200×675）：入学許可書・講師任命書と同じ体裁。合宿のあゆみ（紋章 → 紋章 ＋LP）と担当の先生／生徒
     ・合宿の記録（1080×1350・たて長）：賞状風の金の枠。ランクの変化・LPのグラフ・数字・よくいたVC・仲間・特別賞・ひとこと */

  // ランクを日本語で（例：エメラルドⅣ・マスター）。LPは出さない
  const TIER_JP = { IRON: "アイアン", BRONZE: "ブロンズ", SILVER: "シルバー", GOLD: "ゴールド", PLATINUM: "プラチナ",
    EMERALD: "エメラルド", DIAMOND: "ダイヤモンド", MASTER: "マスター", GRANDMASTER: "グランドマスター", CHALLENGER: "チャレンジャー" };
  const ROMAN = { I: "Ⅰ", II: "Ⅱ", III: "Ⅲ", IV: "Ⅳ" };
  function jpRank(r){
    if (!r || !r.tier) return "ランクなし";
    const t = TIER_JP[r.tier] || r.tier;
    return /^(MASTER|GRANDMASTER|CHALLENGER)$/.test(r.tier) ? t : t + (ROMAN[r.division] || r.division || "");
  }
  const SCHOOL = "クラウドハッシュテイル校";
  // 毛筆で使う字（Googleフォントは使う字だけ読むので、ここに入っていない字はゴシックになる）
  const BRUSH_FIXED = SCHOOL + "〇一二三四五六七八九十年月日殿校長之印卒業証書感謝状";

  /* 賞状の枠：和紙の地＋金の帯（七宝つなぎ）＋細い二重線＋四すみの菱。内側のはしの位置を返す */
  function drawFormalFrame(g, W, H, o){
    o = o || {};
    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#FCF8EE"); bg.addColorStop(1, "#F4ECD6");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    // 和紙のざらつき（毎回同じ模様になるように決まった乱数で）
    let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    g.save();
    for (let i = 0, n = Math.round(W * H / 240); i < n; i++){
      g.globalAlpha = .02 + rnd() * .035; g.fillStyle = rnd() < .55 ? "#8A7650" : "#FFFFFF";
      g.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 2.4, 1);
    }
    g.restore();
    const B = o.inset || 20, T = o.band || 28;
    const gold = g.createLinearGradient(0, 0, W, H);
    gold.addColorStop(0, "#C69B42"); gold.addColorStop(.3, "#EAD290"); gold.addColorStop(.55, "#C29640");
    gold.addColorStop(.8, "#E6CB82"); gold.addColorStop(1, "#BE9038");
    g.save();
    g.beginPath(); g.rect(B, B, W - 2 * B, H - 2 * B); g.rect(B + T, B + T, W - 2 * (B + T), H - 2 * (B + T));
    g.fillStyle = gold; g.fill("evenodd"); g.clip("evenodd");
    // 七宝つなぎ：格子の点と、そのまん中の点に、同じ大きさの円
    const d = T * .62, r = d / 2;
    g.strokeStyle = "rgba(110,78,18,.38)"; g.lineWidth = 1.1;
    for (let yy = B - d; yy < H - B + d; yy += d) for (let xx = B - d; xx < W - B + d; xx += d){
      g.beginPath(); g.arc(xx, yy, r, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(xx + r, yy + r, r, 0, Math.PI * 2); g.stroke();
    }
    g.restore();
    g.strokeStyle = "#8C6A24"; g.lineWidth = 2;
    g.strokeRect(B, B, W - 2 * B, H - 2 * B); g.strokeRect(B + T, B + T, W - 2 * (B + T), H - 2 * (B + T));
    const I = B + T + 7;
    g.strokeStyle = "#B8913E"; g.lineWidth = 1; g.strokeRect(I, I, W - 2 * I, H - 2 * I);
    // 四すみの菱
    [[B + T / 2, B + T / 2], [W - B - T / 2, B + T / 2], [B + T / 2, H - B - T / 2], [W - B - T / 2, H - B - T / 2]].forEach(([x, y]) => {
      g.save(); g.translate(x, y); g.rotate(Math.PI / 4);
      g.fillStyle = "#8C6A24"; g.fillRect(-T * .42, -T * .42, T * .84, T * .84);
      g.fillStyle = "#F3DFA2"; g.fillRect(-T * .24, -T * .24, T * .48, T * .48);
      g.restore();
    });
    return I;
  }
  // ランクの紋章を (cx, cy) を中心に。画像が無いティアは色つきの丸
  async function drawRankC(g, rank, cx, cy, h){
    if (!rank || !rank.tier) return 0;
    const ov = C.rankIconOf(rank.tier);
    const im = ov && ov.img ? await loadImg(ov.img) : null;
    if (im){
      const k = Math.min(h / im.naturalHeight, h * 1.4 / im.naturalWidth);
      const w = im.naturalWidth * k, hh = im.naturalHeight * k;
      g.drawImage(im, cx - w / 2, cy - hh / 2, w, hh);
      return w;
    }
    g.beginPath(); g.arc(cx, cy, h / 2 - 2, 0, Math.PI * 2); g.fillStyle = cssColor(C.rankColor(rank)); g.fill();
    g.fillStyle = "#fff"; g.font = "900 " + Math.round(h * .42) + 'px "Space Grotesk",sans-serif';
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(String(rank.tier).slice(0, 1), cx, cy + 1);
    g.textBaseline = "alphabetic";
    return h;
  }
  function drawArrow(g, x0, x1, cy, th, fill){
    const hl = th * 1.9;
    g.beginPath();
    g.moveTo(x0, cy - th / 2); g.lineTo(x1 - hl, cy - th / 2); g.lineTo(x1 - hl, cy - th * 1.25); g.lineTo(x1, cy);
    g.lineTo(x1 - hl, cy + th * 1.25); g.lineTo(x1 - hl, cy + th / 2); g.lineTo(x0, cy + th / 2); g.closePath();
    g.fillStyle = fill; g.fill();
  }

  const toBlob = cv => new Promise((res, rej) => {
    try { cv.toBlob(b => b ? res(b) : rej(new Error("画像を作れませんでした")), "image/png"); }
    catch(err){ rej(err); }
  });

      const x0 = L + 26, x1 = R - 26, y0 = y + 30, y1 = y + chH - 40;
      const dN = k => Math.round((Date.parse(k) - Date.parse(D.album.start)) / 864e5);
      const total = Math.max(1, dN(D.album.end));
      const px = k => x0 + Math.min(1, Math.max(0, dN(k) / total)) * (x1 - x0);
      const vs = pts.map(p => p.v);
      let mn = Math.min.apply(null, vs), mxv = Math.max.apply(null, vs);
      const pad = Math.max(30, (mxv - mn) * .15); mn -= pad; mxv += pad;
      const py = v => y1 - (v - mn) / (mxv - mn) * (y1 - y0);
      // ランクの区切り線（1ディビジョン＝100。幅が広いときはティアごと）
      const stp = (mxv - mn) > 500 ? 400 : 100;
      g.font = "700 11px " + JP;
      let lastLb = "";
      for (let v = Math.ceil(mn / stp) * stp; v <= mxv; v += stp){
        const yy = py(v), lb = jpRank(C.rankOfAbs(v));
        if (lb === lastLb) continue;   // マスター以上は1本だけ
        lastLb = lb;
        g.strokeStyle = "rgba(109,134,153,.25)"; g.lineWidth = 1; g.setLineDash([4, 5]);
        g.beginPath(); g.moveTo(x0, yy); g.lineTo(x1, yy); g.stroke(); g.setLineDash([]);
        g.textAlign = "left"; g.fillStyle = muted; g.fillText(lb, x0 + 2, yy - 4);
      }
      // 日付（1週間ごと）
      g.textAlign = "center"; g.fillStyle = muted; g.font = "700 12px " + EN;
      const dayAt = d => new Date(Date.parse(D.album.start) + d * 864e5).toISOString().slice(0, 10);
      for (let d = 0; d <= total; d += 7) g.fillText(md(dayAt(d)), x0 + d / total * (x1 - x0), y1 + 24);
      if (total % 7 > 2) g.fillText(md(D.album.end), x1, y1 + 24);
      // 面と線
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(px(p.day), py(p.v)) : g.moveTo(px(p.day), py(p.v)));
      g.lineTo(px(pts[pts.length - 1].day), y1); g.lineTo(px(pts[0].day), y1); g.closePath();
      g.globalAlpha = .14; g.fillStyle = acc; g.fill(); g.globalAlpha = 1;
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(px(p.day), py(p.v)) : g.moveTo(px(p.day), py(p.v)));
      g.strokeStyle = acc; g.lineWidth = 3.5; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
      pts.forEach(p => { g.beginPath(); g.arc(px(p.day), py(p.v), 3.5, 0, Math.PI * 2); g.fillStyle = "#fff"; g.fill(); g.lineWidth = 2; g.strokeStyle = acc; g.stroke(); });
      // いちばん高かった日
      const pk = pts[vs.indexOf(Math.max.apply(null, vs))];
      const kx = px(pk.day), ky = py(pk.v);
      g.beginPath(); g.arc(kx, ky, 7, 0, Math.PI * 2); g.fillStyle = "#F4C542"; g.fill(); g.lineWidth = 2.5; g.strokeStyle = "#fff"; g.stroke();
      const pl = "最高 " + jpRank(C.rankOfAbs(pk.v));
      g.font = "900 13px " + JP; const plw = g.measureText(pl).width + 18;
      const bx = Math.min(x1 - plw, Math.max(x0, kx - plw / 2)), by = Math.max(y - 4 + 8, ky - 36);
      rr(g, bx, by, plw, 22, 11); g.fillStyle = "#8C6A24"; g.fill();
      g.textAlign = "center"; g.fillStyle = "#fff"; g.fillText(pl, bx + plw / 2, by + 16);
    } else {
      g.textAlign = "left"; g.fillStyle = muted; g.font = "500 16px " + JP; g.fillText("グラフにできるLPの記録がまだありません", L + 24, y + chH / 2);
    }
    y += chH + 40;

    // ---- ③ 数字で見る合宿（あるものだけ・最大8） ----
    const co = e.teacher ? (e.t && e.t.coach) : e.coach;
    const tiles = [];
    if (e.games != null) tiles.push(["🎮", "こなした試合数", e.games + "試合", "合宿期間中のTFT"]);
    if (e.vc && e.vc.seconds) tiles.push(["🎧", "VCにいた時間", hours(e.vc.seconds) + "時間", "合宿期間中の合計"]);
    if (co) tiles.push(["🎓", "コーチング時間", hours(co.sec) + "時間", co.ch[0] + (co.ch.length > 1 ? " ほか" : "") + "で"]);
    if (e.thanks) tiles.push(["🙏", "ありがとうの回数", e.thanks + "回", "チャットで言った回数"]);
    if (e.peak) tiles.push(["👑", "最高ランク", jpRank(e.peak.rank), e.peak.rank.lp + "LP ・ " + md(e.peak.day)]);
    if (e.bestDay) tiles.push(["🚀", "いちばん伸びた日", "+" + e.bestDay.delta + "LP", md(e.bestDay.day)]);
    if (e.snap) tiles.push(["📸", e.snap.label, e.snap.total + "pt", e.snap.n + "回参加・最高" + e.snap.best + "位"]);
    if (e.exam) tiles.push(["📝", "中間試験", e.exam.score + "点", e.exam.of + "人中 " + e.exam.rank + "位"]);
    head("数字で見る合宿", y); y += 14;
    const tl = tiles.slice(0, 8), tw = (CW - 36) / 4, th = 92;
    if (!tl.length){ card(L, y, CW, 60); g.textAlign = "left"; g.fillStyle = muted; g.font = "500 15px " + JP; g.fillText("記録はまだありません", L + 24, y + 37); y += 60 + 40; }
    else {
      tl.forEach((t, i) => {
        const bx = L + (i % 4) * (tw + 12), by = y + Math.floor(i / 4) * (th + 12);
        card(bx, by, tw, th);
        g.textAlign = "left"; g.font = "22px sans-serif"; g.fillStyle = ink; g.fillText(t[0], bx + 14, by + 32);
        g.fillStyle = muted; g.font = "900 12.5px " + JP; g.fillText(fitText(g, t[1], tw - 60), bx + 46, by + 28);
        g.fillStyle = ink; let vf = 28; g.font = "900 " + vf + "px " + JP;
        while (vf > 16 && g.measureText(t[2]).width > tw - 28){ vf -= 1; g.font = "900 " + vf + "px " + JP; }
        g.fillText(t[2], bx + 14, by + 66);
        g.fillStyle = muted; g.font = "500 11.5px " + JP; g.fillText(fitText(g, t[3] || "", tw - 28), bx + 14, by + 84);
      });
      y += Math.ceil(tl.length / 4) * (th + 12) - 12 + 40;
    }

    // ---- ④ よくいたVC ／ いっしょに過ごした仲間（横棒） ----
    const colW = (CW - 24) / 2, LX = L, RX = L + colW + 24, rowH = 30, listH = 5 * rowH + 18;
    head("よくいたVC", y, LX); head("いっしょに過ごした仲間", y, RX); y += 14;
    card(LX, y, colW, listH); card(RX, y, colW, listH);
    const bar = (x, yy, w, frac) => {
      rr(g, x, yy - 6, w, 10, 5); g.fillStyle = "rgba(109,134,153,.14)"; g.fill();
      if (frac > 0){ rr(g, x, yy - 6, Math.max(10, w * frac), 10, 5); g.fillStyle = acc; g.fill(); }
    };
    const chs = (e.vcCh || []).slice(0, 5);
    if (chs.length){
      const mxs = chs[0].seconds || 1;
      chs.forEach((c, i) => {
        const yy = y + 26 + i * rowH;
        g.textAlign = "left"; g.fillStyle = ink; g.font = "900 14px " + JP; g.fillText(fitText(g, c.name, 160), LX + 16, yy + 4);
        bar(LX + 186, yy, colW - 186 - 76, c.seconds / mxs);
        g.textAlign = "right"; g.fillStyle = muted; g.font = "700 13px " + JP; g.fillText(hours(c.seconds) + "時間", LX + colW - 14, yy + 4);
      });
    } else { g.textAlign = "left"; g.fillStyle = muted; g.font = "500 14px " + JP; g.fillText("VCの記録はまだありません", LX + 16, y + 40); }
    const mates = ((e.vc && e.vc.mates) || []).slice(0, 5);
    if (mates.length){
      const mxs = mates[0].seconds || 1, medal = ["#F4C542", "#C9D1D9", "#D9A066"];
      for (let i = 0; i < mates.length; i++){
        const m = mates[i], yy = y + 26 + i * rowH;
        g.beginPath(); g.arc(RX + 22, yy, 10, 0, Math.PI * 2); g.fillStyle = medal[i] || "rgba(109,134,153,.18)"; g.fill();
        g.textAlign = "center"; g.fillStyle = i < 3 ? "#4A3A10" : muted; g.font = "700 12px " + EN; g.fillText(String(i + 1), RX + 22, yy + 4);
        const mn = m.name || D.nameOf(m.id);   // m.name はダミーの仲間
        await drawAvatar(g, m.name ? [m.avatar] : D.avatarsOf(m.id), mn, RX + 50, yy, 12, acc);
        g.textAlign = "left"; g.fillStyle = ink; g.font = "900 14px " + JP; g.fillText(fitText(g, mn, 120), RX + 70, yy + 5);
        bar(RX + 200, yy, colW - 200 - 76, m.seconds / mxs);

    y += listH + 40;

  /* 先生と担当の生徒のペア画像（1200×675）。枠・ハンコは卒業証書と同じ */
  async function makePairImage(t, s){

      g.fillStyle = ink; g.font = "900 15px " + JP;
      g.fillText(fitText(g, C.rankLabel(s.start.rank), 170), CX - 95, 270);
      g.fillText(fitText(g, C.rankLabel(s.end.rank), 170), CX + 95, 270);
      g.fillStyle = muted; g.font = "500 12px " + JP;
      g.fillText("開校のころ", CX - 95, 288); g.fillText("卒業のころ", CX + 95, 288);
      g.fillStyle = s.gain > 0 ? "#5F9E3C" : s.gain < 0 ? "#DF5B4C" : muted;

    // 左右をつなぐ金の点線
    g.save(); g.setLineDash([2, 8]); g.lineCap = "round"; g.strokeStyle = goldA; g.lineWidth = 3;
    g.beginPath(); g.moveTo(340, 322); g.lineTo(CX - 120, 322); g.moveTo(CX + 120, 322); g.lineTo(W - 340, 322); g.stroke();

      g.lineTo(x1, y1 + 6); g.lineTo(x0, y1 + 6); g.closePath();
      g.globalAlpha = .14; g.fillStyle = goldA; g.fill(); g.globalAlpha = 1;
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(px(i), py(p.v)) : g.moveTo(px(i), py(p.v)));
      g.strokeStyle = goldA; g.lineWidth = 3.5; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
      const pi = vs.indexOf(mx);
      g.beginPath(); g.arc(px(pi), py(mx), 6, 0, Math.PI * 2); g.fillStyle = leaf; g.fill();

    // いちばん下：印字・VC・ハッシュタグ

  }

  /* 寄せ書き色紙（1080×1350・たて長）。まん中に本人、まわりにみんなのふせん */
  function wrapAll(g, text, maxW){
    const out = [];
    String(text || "").split("\n").forEach(par => {
      let line = "";
      for (const ch of par){
        if (line && g.measureText(line + ch).width > maxW){ out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    });
    return out;
  }

    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const ink = "#23384D", muted = "#6D8699", leaf = cssColor("var(--leaf)");
    const JP = '"Zen Kaku Gothic New",sans-serif', BR = '"Yuji Boku",' + JP;
    const goldA = "#C9A24A", goldB = "#E8CD82";

    // 色紙：クリーム色の紙＋金のふち
    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#FFFCF3"); bg.addColorStop(.55, "#FBF6E8"); bg.addColorStop(1, "#F4F1E4");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const edge = g.createLinearGradient(0, 0, W, H);
    edge.addColorStop(0, goldB); edge.addColorStop(.5, goldA); edge.addColorStop(1, goldB);
    g.strokeStyle = edge; g.lineWidth = 22; g.strokeRect(11, 11, W - 22, H - 22);
    g.strokeStyle = "rgba(201,162,74,.55)"; g.lineWidth = 2; g.strokeRect(36, 36, W - 72, H - 72);
    const emb = await loadImg("assets/emblem.png");
    if (emb){ g.save(); g.globalAlpha = .05; g.drawImage(emb, W / 2 - 260, H / 2 - 240, 520, 520); g.restore(); }

    // 見出し
    g.textAlign = "center"; g.textBaseline = "alphabetic";
    g.fillStyle = leaf; g.font = "900 16px " + JP;
    g.fillText("クラウドハッシュテイル校" + (D.album.term ? "　" + D.album.term : ""), W / 2, 88);
    g.fillStyle = ink; g.font = "400 62px " + BR;
    const tt = Array.from("寄せ書き"); let tw = tt.reduce((n, ch) => n + g.measureText(ch).width, 0) + 16 * (tt.length - 1);
    let tx = W / 2 - tw / 2; g.textAlign = "left";
    tt.forEach(ch => { g.fillText(ch, tx, 158); tx += g.measureText(ch).width + 16; });
    g.strokeStyle = goldA; g.lineWidth = 2;
    g.beginPath(); g.moveTo(W / 2 - 130, 182); g.lineTo(W / 2 - 14, 182); g.moveTo(W / 2 + 14, 182); g.lineTo(W / 2 + 130, 182); g.stroke();
    g.beginPath(); g.moveTo(W / 2, 177); g.lineTo(W / 2 + 5, 182); g.lineTo(W / 2, 187); g.lineTo(W / 2 - 5, 182); g.closePath();
    g.fillStyle = goldA; g.fill();

    // ふせんを置くマス：まん中（本人）を空けて、いちばん大きく置ける並べ方を選ぶ
    const x0 = 66, x1 = W - 66, y0 = 206, y1 = H - 70;
    const cy = Math.round((y0 + y1) / 2) - 10;
    const CR = { x: W / 2 - 148, y: cy - 120, w: 296, h: 270 };
    const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    let best = null, most = null;
    for (let cols = 2; cols <= 5; cols++) for (let rows = 2; rows <= 10; rows++){
      const cw = (x1 - x0) / cols, ch = (y1 - y0) / rows;
      const cells = [];
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        const cell = { x: x0 + c * cw, y: y0 + r * ch, w: cw, h: ch };
        if (!hit(cell, CR)) cells.push(cell);
      }
      const fit = Math.min(cw, ch * 1.25);       // 横長すぎ・縦長すぎを避ける
      if (cells.length >= ms.length && (!best || fit > best.fit)) best = { cells, fit };
      if (!most || cells.length > most.cells.length) most = { cells, fit };
    }
    best = best || most;     // 多すぎて入りきらないときは、いちばんマスの多い並べ方で「ほか○枚」
    const dist = c => Math.hypot(c.x + c.w / 2 - W / 2, (c.y + c.h / 2 - cy) * 1.1);
    const cells = best.cells.slice().sort((a, b) => dist(a) - dist(b));
    const shown = ms.length > cells.length ? ms.slice(0, cells.length - 1) : ms;

    for (let i = 0; i < shown.length; i++){
      const m = shown[i], c = cells[i];
      const pad = 10, cw = Math.min(c.w - pad * 2, 330), chh = c.h - pad * 2 - 4;
      // 本文（入るいちばん大きい文字で。上限26px）
      const footH = 28, inner = cw - 30;
      let fs = Math.min(26, Math.max(14, Math.floor(chh / 6))), lines = [];
      for (; fs >= 12; fs--){
        g.font = "600 " + fs + "px " + HAND;
        lines = wrapAll(g, m.text, inner);
        if (lines.length * fs * 1.5 <= chh - 22 - footH) break;
      }
      const maxL = Math.max(1, Math.floor((chh - 22 - footH) / (fs * 1.5)));
      if (lines.length > maxL){ lines = lines.slice(0, maxL); lines[maxL - 1] = fitText(g, lines[maxL - 1] + "…", inner); }
      // ふせんの大きさは中身に合わせる（マスの中で少しずらして置く）
      const nw = cw, nh = Math.min(chh, Math.max(110, lines.length * fs * 1.5 + 22 + footH + 8));
      const jx = ((m.key.length * 7) % 13) - 6, jy = ((m.key.charCodeAt(2) * 5) % 11) - 5;
      const ccx = c.x + c.w / 2 + jx, ccy = c.y + c.h / 2 + jy;
      g.save();
      g.translate(ccx, ccy);
      g.rotate(yoseTilt(m.key) * Math.PI / 180);
      g.shadowColor = "rgba(0,0,0,.16)"; g.shadowBlur = 12; g.shadowOffsetY = 5;
      rr(g, -nw / 2, -nh / 2, nw, nh, 8); g.fillStyle = C.YOSE_COLORS[m.color]; g.fill();
      g.shadowColor = "transparent";
      g.save(); g.rotate(-.03); g.fillStyle = "rgba(255,255,255,.6)"; g.fillRect(-28, -nh / 2 - 8, 56, 16); g.restore();
      g.font = "600 " + fs + "px " + HAND;
      g.fillStyle = "#3A3226"; g.textAlign = "left"; g.textBaseline = "top";
      lines.forEach((ln, k) => g.fillText(ln, -nw / 2 + 15, -nh / 2 + 15 + k * fs * 1.5));
      // 書いた人（右下）
      g.textBaseline = "alphabetic"; g.textAlign = "right"; g.font = "900 13px " + JP;
      const nm = fitText(g, D.nameOf(m.from), nw - 70);
      g.fillText(nm, nw / 2 - 12, nh / 2 - 12);
      const nmw = g.measureText(nm).width;
      await drawAvatar(g, D.avatarsOf(m.from), D.nameOf(m.from), nw / 2 - 12 - nmw - 14, nh / 2 - 17, 9, "#fff");
      g.restore();
    }
    if (shown.length < ms.length){
      const c = cells[shown.length];
      g.textAlign = "center"; g.fillStyle = muted; g.font = "900 22px " + JP;
      g.fillText("ほか " + (ms.length - shown.length) + "枚", c.x + c.w / 2, c.y + c.h / 2 + 8);
    }

    // まん中：本人
    const ring = g.createLinearGradient(W / 2 - 90, cy - 110, W / 2 + 90, cy + 70);
    ring.addColorStop(0, goldB); ring.addColorStop(1, goldA);
    await drawAvatar(g, [e.avatar, e.avatarAlt], e.name, W / 2, cy - 22, 84, ring);
    g.textAlign = "center"; g.fillStyle = ink;
    let fs = 34; g.font = "900 " + fs + "px " + JP;
    while (fs > 16 && g.measureText(e.name).width > 230){ fs -= 1; g.font = "900 " + fs + "px " + JP; }
    const nm = fitText(g, e.name, 230), nw2 = g.measureText(nm).width;
    g.font = "400 26px " + BR; const sw = g.measureText("さんへ").width;
    const sx = W / 2 - (nw2 + 8 + sw) / 2;
    g.textAlign = "left"; g.font = "900 " + fs + "px " + JP; g.fillText(nm, sx, cy + 104);
    g.font = "400 26px " + BR; g.fillText("さんへ", sx + nw2 + 8, cy + 104);
    g.textAlign = "center"; g.fillStyle = muted; g.font = "700 15px " + JP;
    g.fillText(ms.length + "人から" + (e.teacher ? " ・ 講師" : ""), W / 2, cy + 132);

    g.fillStyle = "rgba(109,134,153,.9)"; g.font = "700 15px " + JP; g.textAlign = "center";
    g.fillText("#TFT合宿", W / 2, H - 46);

    return new Promise((res, rej) => {
      try { cv.toBlob(b => b ? res(b) : rej(new Error("画像を作れませんでした")), "image/png"); }
      catch(err){ rej(err); }
    });
  }

  /* ================= 起動 ================= */
  loadAll().then(() => {
    if (!D.album.published && !IS_ADMIN){
      $("view").innerHTML = coverHtml().replace('<div class="period">',
        '<div style="font-size:40px;margin:6px 0">📜</div><div class="period">') +
        '<div class="panel"><div class="empty">卒業証書は<b>後夜祭</b>で授与します。<br>' +
        "それまで、あと少しだけ楽しみにしていてください！</div></div>";
      return;
    }
    const id = new URLSearchParams(location.search).get("id");
    if (id) viewPage(id); else viewList();
    // 管理画面から「保存前の文言」が届いたら、その内容で証書を描き直す
    if (EMBED && id){
      let tm = null;
      window.addEventListener("message", ev => {
        if (ev.origin !== location.origin || !ev.data || ev.data.type !== "album-draft") return;
        clearTimeout(tm);
        tm = setTimeout(() => {
          const al = C.normAlbum ? C.normAlbum(ev.data.album) : ev.data.album;
          loadAll(al).then(() => viewPage(ev.data.id || id)).catch(err => console.warn(err));
        }, 250);
      });
      try { parent.postMessage({ type: "album-cert-ready", id }, location.origin === "null" ? "*" : location.origin); } catch(x){}
    }
  }).catch(err => {
    console.error(err);
    $("view").innerHTML = '<div class="panel"><div class="empty">卒業証書を読み込めませんでした。<br>' + esc(err.message) + "</div></div>";
  });
})();
</script>
