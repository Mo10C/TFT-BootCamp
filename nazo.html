<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>謎解き ｜ クラウドハッシュテイル校 TOOLS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7CA455">
<meta name="description" content="謎解き — チームで画像の謎を解いてキーワードを入力">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=5.3">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--nz:#1F4E5F;--nz2:#2E7D8C;--nzA:#F2B544}
.wrap.wide{max-width:1440px}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;box-shadow:var(--shadow-soft);overflow:hidden;margin-bottom:14px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--border)}
.phead h2{font-size:15px;font-weight:900}
.phead .sub{font-size:11px;color:var(--muted)}
.pbody{padding:15px 17px}
.spacer{flex:1}
.empty{padding:28px 18px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.9}
.note{font-size:11.5px;color:var(--muted);line-height:1.75}
.txt{font-size:14px;line-height:2;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.xbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit;text-decoration:none;transition:transform .1s,border-color .1s}
.xbtn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--nz2)}
.xbtn:disabled{opacity:.45;cursor:default}
.xbtn.main{background:var(--nz);border-color:transparent;color:#fff}
.xbtn.gold{background:var(--nzA);border-color:transparent;color:#3B2A05}
.xbtn.sm{padding:5px 11px;font-size:11.5px}
.xbtn.danger{color:var(--danger)}
.av{width:26px;height:26px;border-radius:99px;object-fit:cover;flex:none;border:2px solid var(--surface)}
.avf{display:inline-grid;place-items:center;background:var(--nz2);color:#fff;font-size:11px;font-weight:900}

/* 表紙・ロビー */
.hero{position:relative;padding:28px 24px 24px;text-align:center;color:#EAF6F4;border-radius:20px;margin-bottom:14px;overflow:hidden;
  background:radial-gradient(420px 200px at 10% 0%,rgba(242,181,68,.35),transparent 70%),
             radial-gradient(520px 240px at 95% 110%,rgba(124,164,85,.45),transparent 70%),
             linear-gradient(150deg,#16323D,#1F4E5F 55%,#2E6B6B)}
.hero .kicker{font-size:11px;font-weight:900;letter-spacing:.3em;color:var(--nzA)}
.hero h1{font-size:34px;font-weight:900;letter-spacing:.06em;margin:6px 0 4px}
.hero p{font-size:13px;opacity:.85}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tc{border:1.5px solid var(--border);border-radius:18px;padding:14px 16px;background:var(--surface);border-top:6px solid var(--tc)}
.tc h3{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.tc .slots{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px;min-height:122px}
.tc .slot{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.tc .slot.free{color:var(--muted);font-weight:500}
.tc .slot.free i{width:26px;height:26px;border-radius:99px;border:2px dashed var(--border-strong);display:inline-block}
.tc .pg{font-size:11.5px;color:var(--muted);font-weight:700}
.tc.mine{box-shadow:0 0 0 2.5px var(--tc)}
.rk{width:100%;border-collapse:collapse;font-size:13px}
.rk td{padding:8px 6px;border-bottom:1px solid var(--border)}
.rk .n{font-family:"Space Grotesk",sans-serif;font-weight:700;width:34px;text-align:center}
.rk .dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.rk tr.me td{background:color-mix(in srgb,var(--nzA) 12%,transparent)}

/* ゲーム画面 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:980px){ .game{grid-template-columns:1fr} }
.tool{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:8px}
.tool .tt{font-weight:900;font-size:14px;margin-right:6px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;min-width:34px;height:32px;padding:0 8px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:900;color:var(--ink);display:inline-grid;place-items:center}
.tb.on{border-color:var(--nz2);background:color-mix(in srgb,var(--nz2) 14%,var(--surface))}
.tb:disabled{opacity:.4;cursor:default}
.cl{width:22px;height:22px;border-radius:99px;border:2px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.cl.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--nz2)}
.sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#0E1E25;aspect-ratio:16/9;box-shadow:var(--shadow-soft);user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage.pen canvas{cursor:crosshair;touch-action:none}
.stage.text canvas{cursor:text;touch-action:none}
.stage.erase canvas{cursor:not-allowed;touch-action:none}
.stage .lock{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;background:rgba(8,18,22,.82);text-align:center;line-height:1.9}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:none;border-radius:12px;background:rgba(0,0,0,.35);color:#fff;
  font-size:24px;cursor:pointer;opacity:.0;transition:opacity .15s;z-index:3}
.stage:hover .nav{opacity:1}
.stage .nav:disabled{display:none}
.stage .nav.l{left:8px} .stage .nav.r{right:8px}
.tin{position:absolute;z-index:4;border:2px solid var(--nzA);border-radius:8px;padding:4px 8px;font:inherit;font-size:15px;font-weight:900;min-width:160px;background:rgba(255,255,255,.95);color:#222}
.below{border:1.5px solid var(--border);border-radius:16px;background:var(--surface);margin-top:10px;padding:14px 16px}
.below h2{font-size:19px;font-weight:900;margin-bottom:4px}
.below .no{font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--nz2)}
.ans{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ans input{flex:1;min-width:180px;border:2px solid var(--border-strong);border-radius:14px;padding:12px 16px;font:inherit;font-size:17px;font-weight:700;background:var(--surface);color:var(--ink);outline:none;letter-spacing:.06em}
.ans input:focus{border-color:var(--nz2)}
.ans .xbtn{padding:12px 22px;font-size:14px}
.ans.ng input{border-color:var(--danger);animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:8px;font-size:13px;font-weight:900;min-height:18px}
.fb.ng{color:var(--danger)}
.hint{margin-top:10px;border:1.5px dashed color-mix(in srgb,var(--nzA) 70%,var(--border));border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.85;white-space:pre-wrap;background:color-mix(in srgb,var(--nzA) 9%,var(--surface))}
.ok{margin-top:12px;border-radius:14px;padding:12px 16px;background:color-mix(in srgb,#5FA35A 12%,var(--surface));border:1.5px solid color-mix(in srgb,#5FA35A 55%,var(--border))}
.ok b{font-size:18px;color:#4C8F47}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--nzA) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--nzA) 50%,var(--border))}
.exp img{max-width:100%;border-radius:12px;margin-top:10px}
.kwbox{margin-top:12px;border:1.5px solid color-mix(in srgb,var(--nzA) 55%,var(--border));border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--nzA) 7%,var(--surface))}
.kwbox b{font-size:13.5px}
.kwbox input{flex:1;min-width:160px;border:2px solid var(--border-strong);border-radius:12px;padding:9px 14px;font:inherit;font-size:16px;font-weight:900;letter-spacing:.06em;background:var(--surface);color:var(--ink);outline:none}
.kwbox input:focus{border-color:var(--nzA)}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0 4px}
.kwc{border:2px dashed var(--border-strong);border-radius:14px;padding:10px 8px;background:var(--surface);cursor:pointer;font-family:inherit;color:var(--ink);text-align:center}
.kwc span{display:block;font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;color:var(--nz2);letter-spacing:.1em}
.kwc b{display:block;font-size:18px;font-weight:900;margin-top:2px;word-break:break-all}
.kwc.on{border-style:solid;border-color:var(--nzA);background:color-mix(in srgb,var(--nzA) 12%,var(--surface))}
.sl .kwt{font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--nzA) 22%,var(--surface));max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clear{text-align:center;padding:20px 16px;border-radius:16px;margin-top:12px;color:#3B2A05;background:linear-gradient(135deg,#FFE6A6,#F7C95C 60%,#F2B544)}
.clear h3{font-size:24px;font-weight:900;letter-spacing:.08em}

/* サイド */
.side .box{border:1.5px solid var(--border);border-radius:16px;background:var(--surface);padding:12px 14px;margin-bottom:10px}
.side .tn{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
.side .tn i{width:14px;height:14px;border-radius:4px;background:var(--tc)}
.side .mem{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.side .mem span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px 2px 2px;border-radius:99px;background:var(--surface-2)}
.side .mem span.me{outline:2px solid var(--tc)}
.side .tm{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:20px;margin-top:8px}
.sl{display:flex;flex-direction:column;gap:4px}
.sl button{display:flex;align-items:center;gap:8px;border:1.5px solid transparent;background:none;border-radius:10px;padding:6px 8px;cursor:pointer;font-family:inherit;color:var(--ink);font-size:12.5px;font-weight:700;text-align:left}
.sl button:hover:not(:disabled){background:var(--surface-2)}
.sl button.on{border-color:var(--nz2);background:color-mix(in srgb,var(--nz2) 10%,var(--surface))}
.sl button:disabled{color:var(--muted);cursor:default}
.sl .st{margin-left:auto;font-size:11px}
.sl .k{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;color:var(--nz2);width:34px}
.memo textarea{width:100%;min-height:200px;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.8;background:color-mix(in srgb,#FFF1A8 22%,var(--surface));color:var(--ink);resize:vertical}
.memo .mt{font-size:10.5px;color:var(--muted);margin-top:4px;min-height:14px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer}
.spec{padding:9px 14px;border-radius:12px;margin-bottom:10px;font-size:12.5px;font-weight:900;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--danger) 40%,var(--border));display:flex;gap:10px;align-items:center}

/* 拡大 */
.zoom{position:fixed;inset:0;z-index:60;background:rgba(5,12,16,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:96vw;max-height:94vh;object-fit:contain}

/* 編集 */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.seg button{border:1.5px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit}
.seg button.on{border-color:var(--nz2);color:#fff;background:var(--nz)}
.ed label{display:block;font-size:11.5px;font-weight:900;color:var(--muted);margin:10px 0 4px}
.ed label.chk{display:inline-flex;margin:0 16px 0 0;color:var(--ink);font-size:12.5px}
.ed .chk input{width:auto}
.ed input,.ed textarea,.ed select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.ed textarea{min-height:80px;line-height:1.8;resize:vertical}
.ed input[type=color]{width:44px;height:34px;padding:2px}
.edc{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px;border-left:6px solid var(--nz2)}
.edc .pv{width:160px;aspect-ratio:16/9;border-radius:10px;background:#0E1E25 center/contain no-repeat;border:1px solid var(--border);flex:none}
.savebar{position:sticky;bottom:10px;display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow);margin-top:10px;z-index:5}
.savebar.dirty{border-color:var(--nzA)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
@media (max-width:620px){ .hero h1{font-size:26px} .ans input{font-size:16px} .tool .tt{display:none} }
</style>
</head>

<div class="wrap" id="wrap">
  <div class="top">
    <div class="brand">
      <div class="brandmark"><img src="assets/emblem.png" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>
      <div><h1>謎解き</h1><div class="sub">クラウドハッシュテイル校 TOOLS ・ 遊び場</div></div>
    </div>
    <span class="badge" id="roleBadge">—</span>
    <div class="spacer"></div>
    <a class="iconbtn" href="home.html">🏠 HOME</a>
    <button class="iconbtn" id="gmBtn" style="display:none">🛠 編集・進行</button>
    <button class="iconbtn" id="themeBtn">🌙</button>
  </div>
  <div id="view"><div class="panel"><div class="empty">読み込み中…</div></div></div>
</div>
<div class="zoom" id="zoom"><img alt=""></div>

<script src="config.js"></script>
<script src="core.js?v=5.3"></script>
<script src="home-common.js?v=5.3"></script>
<script>
(function(){
  "use strict";
  const C = window.LBCore;
  const $ = id => document.getElementById(id);
  const session = C.Session.require();
  if (!session) return;
  const ctx = window.MCCHome ? window.MCCHome.boot(session) : null;
  const toast = t => (ctx && ctx.toast ? ctx.toast(t) : alert(t));
  const IS_GM = C.isAdmin(session);
  const me = { id: String(session.discord.id), name: session.discord.name || session.discord.username || "?", avatar: session.discord.avatar || "" };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* =========================================================
     保存先（既存のFirestoreルール match /lboard_index/{id} のまま使える）
       lboard_index/nazo            … 問題（イントロ・問題・アウトロ・チーム）
       lboard_index/nazo_t_<チームID> … チームごとの進み具合・メモ・スライド上の書き込み
     答えは「ひらがな・小文字・空白なし」にそろえてから SHA-256 にして保存します。
     ========================================================= */
  const DOC_CFG = "nazo", DOC_ST = "nazo_state", TDOC = id => "nazo_t_" + id;

  /* ---- Firestore（無ければ localStorage で動く。テスト用） ---- */
  function openDb(){
    const fb = (window.MCC_LB_CONFIG || {}).firebase || {};
    if (!(fb.apiKey && fb.projectId && typeof window.firebase !== "undefined" && firebase.firestore)) return null;
    if (!firebase.apps.length) firebase.initializeApp(fb);
    return firebase.firestore();
  }
  const db = openDb();
  const LS = id => "mcc-nz-" + id;
  const lsGet = id => { try { return JSON.parse(localStorage.getItem(LS(id)) || "null"); } catch(e){ return null; } };
  const lsSubs = {};
  const lsFire = id => (lsSubs[id] || []).forEach(f => f(lsGet(id)));
  function deepMerge(a, b){ Object.keys(b).forEach(k => { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) { a[k] = a[k] && typeof a[k] === "object" ? a[k] : {}; deepMerge(a[k], b[k]); } else a[k] = b[k]; }); return a; }
  const store = {
    sub(id, cb){
      if (db) return db.collection("lboard_index").doc(id).onSnapshot(s => cb(s.exists ? s.data() : null), e => { console.warn(e); cb(null); });
      (lsSubs[id] = lsSubs[id] || []).push(cb); setTimeout(() => cb(lsGet(id)), 0);
      return () => { lsSubs[id] = (lsSubs[id] || []).filter(f => f !== cb); };
    },
    async merge(id, obj){
      if (db) return db.collection("lboard_index").doc(id).set(obj, { merge: true });
      const cur = lsGet(id) || {}; deepMerge(cur, obj); localStorage.setItem(LS(id), JSON.stringify(cur)); lsFire(id);
    },
    async put(id, obj){
      if (db) return db.collection("lboard_index").doc(id).set(obj);
      localStorage.setItem(LS(id), JSON.stringify(obj)); lsFire(id);
    },
    async del(id, path){
      if (db) return db.collection("lboard_index").doc(id).update({ [path]: firebase.firestore.FieldValue.delete() });
      const cur = lsGet(id) || {}; const ps = path.split("."); let o = cur;
      for (let i = 0; i < ps.length - 1; i++){ o = o[ps[i]]; if (!o) return; }
      delete o[ps[ps.length - 1]]; localStorage.setItem(LS(id), JSON.stringify(cur)); lsFire(id);
    },
    async tx(id, fn){        // fn(cur) → 書き込むmerge用オブジェクト（エラーで中止）
      if (db){
        const ref = db.collection("lboard_index").doc(id);
        return db.runTransaction(async t => { const s = await t.get(ref); const w = fn(s.exists ? s.data() : null); if (w) t.set(ref, w, { merge: true }); });
      }
      const w = fn(lsGet(id)); if (w) await store.merge(id, w);
    }
  };
  window.addEventListener("storage", e => { if (e.key && e.key.indexOf("mcc-nz-") === 0) lsFire(e.key.slice(7)); });

  /* ---------- 答えのそろえ方 ---------- */
  function normAns(s){
    s = String(s || "").normalize("NFKC").toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
    return s.replace(/[\s　・、。,.!！?？「」『』()（）\[\]【】"'`~〜\-_―‐]/g, "");
  }
  async function hashAns(pid, s){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("chc-nazo:" + pid + ":" + normAns(s)));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  /* ---------- 問題の形 ---------- */
  const TEAM_COLORS = ["#E06A5B", "#3F7FC4", "#4F9A55", "#8A5CC6", "#E0A13A", "#2E9C9C"];
  function sampleCfg(){
    const q = (i, title) => ({ id: "q" + i, title, img: "assets/nazo/q" + i + ".png", text: "（ここに問題文や補足を書きます）", hint: "" });
    return {
      title: "クラウドハッシュテイル校の謎", subtitle: "4人1チームで、5つの謎を解き明かせ", open: true, ranking: true, teamSize: 4,
      teams: [1, 2, 3, 4].map(i => ({ id: "t" + i, name: "チーム" + i, color: TEAM_COLORS[i - 1] })),
      intro: { title: "プロローグ", img: "assets/nazo/intro.png", text: "（ここにイントロのストーリーを書きます）\nある日、校舎に一通の手紙が届いた──。" },
      questions: [q(1, "第1の謎"), q(2, "第2の謎"), q(3, "第3の謎"), q(4, "第4の謎"), q(5, "第5の謎")],
      // 答えは最終回答の1つだけ

  /* ---------- スライド上の書き込み ----------
     座標は画像の左上を(0,0)、右下を(1000,1000)にした整数で保存（画面の大きさが違っても同じ位置） */
  function imgRect(){
    const st = $("stage"), im = $("simg"); const W = st.clientWidth, H = st.clientHeight;
    if (!im || !im.naturalWidth) return { x: 0, y: 0, w: W, h: H };
    const r = Math.min(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * r, h = im.naturalHeight * r;
    return { x: (W - w) / 2, y: (H - h) / 2, w, h };
  }
  let drawing = null;
  function drawInk(){
    const cv = $("ink"); if (!cv) return;
    const st = $("stage"), dpr = window.devicePixelRatio || 1;
    const W = st.clientWidth, H = st.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    if (!inkOn) return;
    const t = team(); if (!t) return;
    const R = imgRect(), X = v => R.x + v / 1000 * R.w, Y = v => R.y + v / 1000 * R.h;
    const items = Object.values((t.ink || {})[slide] || {}).sort((a, b) => a.at - b.at);
    if (drawing) items.push(drawing);
    items.forEach(it => {
      if (it.t === "l"){
        const pts = String(it.p || "").split(" ").map(s => s.split(",").map(Number)).filter(p => p.length === 2);
        if (!pts.length) return;
        g.strokeStyle = it.c; g.lineWidth = Math.max(2, R.w / 1000 * 3.2 * (it.w || 1)); g.lineCap = "round"; g.lineJoin = "round";
        g.beginPath(); g.moveTo(X(pts[0][0]), Y(pts[0][1]));
        if (pts.length === 1) g.lineTo(X(pts[0][0]) + .1, Y(pts[0][1]));
        for (let i = 1; i < pts.length - 1; i++){ const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; g.quadraticCurveTo(X(pts[i][0]), Y(pts[i][1]), X(mx), Y(my)); }
        if (pts.length > 1) g.lineTo(X(pts[pts.length - 1][0]), Y(pts[pts.length - 1][1]));
        g.stroke();
      } else if (it.t === "x"){
        const fs = Math.max(12, R.w / 1000 * 30);
        g.font = "900 " + fs + 'px "Zen Kaku Gothic New",sans-serif'; g.textBaseline = "top";
        g.lineWidth = Math.max(3, fs / 5); g.strokeStyle = it.c === "#FFFFFF" ? "rgba(0,0,0,.75)" : "rgba(255,255,255,.92)"; g.lineJoin = "round";
        String(it.s || "").split("\n").forEach((ln, i) => { g.strokeText(ln, X(it.x), Y(it.y) + i * fs * 1.2); g.fillStyle = it.c; g.fillText(ln, X(it.x), Y(it.y) + i * fs * 1.2); });
      }
    });
  }
  window.addEventListener("resize", () => drawInk());
  function bindInk(){
    const cv = $("ink"); if (!cv || spectate) return;
    const tid = viewTeamId();
    const pos = e => { const b = cv.getBoundingClientRect(), R = imgRect();
      return [Math.round(Math.max(0, Math.min(1000, (e.clientX - b.left - R.x) / R.w * 1000))), Math.round(Math.max(0, Math.min(1000, (e.clientY - b.top - R.y) / R.h * 1000)))]; };
    cv.onpointerdown = e => {
      if (!unlockedKey(team(), slide)) return;
      if (tool === "pen"){
        cv.setPointerCapture(e.pointerId);
        const p = pos(e);
        drawing = { t: "l", c: color, w: 1, p: p.join(","), by: me.id, at: Date.now(), _pts: [p] };
        drawInk(); e.preventDefault();
      } else if (tool === "text"){
        e.preventDefault(); textInput(e, pos(e));
      } else if (tool === "erase"){
        const p = pos(e), hit = hitTest(p);
        if (hit) store.del(TDOC(tid), "ink." + slide + "." + hit).catch(er => toast(er.message));
      }
    };
    cv.onpointermove = e => {
      if (!drawing) return;
      const p = pos(e), l = drawing._pts[drawing._pts.length - 1];
      if (Math.hypot(p[0] - l[0], p[1] - l[1]) < 3 || drawing._pts.length > 600) return;
      drawing._pts.push(p); drawing.p = drawing._pts.map(x => x.join(",")).join(" "); drawInk();
    };
    cv.onpointerup = cv.onpointercancel = () => {
      if (!drawing) return;
      const it = { t: "l", c: drawing.c, w: 1, p: drawing.p, by: me.id, at: Date.now() };
      drawing = null;
      const id = "i" + uid();
      const t = team(); t.ink[slide] = t.ink[slide] || {}; t.ink[slide][id] = it;      // 先に手元に描いておく
      drawInk();
      store.merge(TDOC(tid), { ink: { [slide]: { [id]: it } } }).catch(er => toast("書き込みを保存できませんでした：" + er.message));
    };
  }
  function hitTest(p){
    const t = team(); const items = Object.entries((t.ink || {})[slide] || {}).sort((a, b) => b[1].at - a[1].at);
    for (const [k, it] of items){
      if (it.t === "l"){
        const pts = String(it.p).split(" ").map(s => s.split(",").map(Number));
        for (let i = 0; i < pts.length; i++){
          const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
          const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
          const u = L ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)) : 0;
          if (Math.hypot(a[0] + u * dx - p[0], a[1] + u * dy - p[1]) < 14) return k;
        }
      } else if (it.t === "x"){
        const lines = String(it.s).split("\n"), w = Math.max(...lines.map(l => l.length)) * 30, h = lines.length * 36;
        if (p[0] >= it.x - 6 && p[0] <= it.x + w && p[1] >= it.y - 6 && p[1] <= it.y + h) return k;
      }
    }
    return "";
  }
  function textInput(e, p){

      const t = team(); t.ink[slide] = t.ink[slide] || {}; t.ink[slide][id] = it; drawInk();

    };
    inp.onkeydown = ev => { if (ev.key === "Enter"){ ev.preventDefault(); commit(); } else if (ev.key === "Escape"){ done = true; inp.remove(); } };
    inp.onblur = commit;
  }
  document.addEventListener("keydown", e => {

    if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ const l = slides(), i = l.findIndex(s => s.key === slide) + (e.key === "ArrowRight" ? 1 : -1); if (l[i]) go(l[i].key); }

              : t.answer ? '<button class="xbtn sm main" data-rev="' + esc(tc.id) + '|auto">📣 発表</button> <button class="xbtn sm" data-rev="' + esc(tc.id) + '|1" title="正解として発表">⭕</button> <button class="xbtn sm" data-rev="' + esc(tc.id) + '|0" title="不正解として発表">❌</button>' : "—") + "</td>" +
            "<td>" + (Object.keys(t.hints).length ? "💡" + Object.keys(t.hints).length : "—") + "</td>" +
            "<td>" + (t.answer && S.startAt ? fmt(t.answer.at - S.startAt) : "—") + "</td>" +
            '<td style="white-space:nowrap"><button class="xbtn sm" data-spec="' + esc(tc.id) + '">👀 画面を見る</button> <button class="xbtn sm danger" data-treset="' + esc(tc.id) + '">リセット</button></td></tr>';
        }).join("") + "</table>" +
        '<div class="note" style="margin-top:8px">「📣 発表」は自動判定のとおりに結果を出します。表記ゆれなどで判定を変えたいときは ⭕ / ❌ で発表してください。<br>「画面を見る」で、チームのスライド・メモ・書き込みをそのまま見られます</div>' +
        '<div class="row" style="margin-top:12px"><button class="xbtn main" id="revAll">📣 提出済みのチームをまとめて発表（自動判定）</button></div>' +
        '<div class="row" style="margin-top:12px"><div class="spacer"></div><button class="xbtn sm danger" id="resetAll">🗑 全チームをリセット（メンバーも外す）</button></div></div></div>';
    } else {
      if (!edit){ edit = JSON.parse(JSON.stringify(cfg)); edit.final._new = edit.final.answers.join("、"); dirty = false; }
      const imgRow = (path, val, ph) => '<div class="row" style="align-items:flex-end"><span class="pv" style="background-image:url(\'' + esc(val) + '\')"></span>' +
        '<div style="flex:1;min-width:200px"><label>画像（ファイルの場所かURL）</label><input data-p="' + path + '" value="' + esc(val) + '" placeholder="' + ph + '"></div></div>';
      html += '<div class="panel ed"><div class="phead"><h2>📘 基本</h2></div><div class="pbody">' +
          '<div class="row"><label class="chk"><input type="checkbox" data-pb="open"' + (edit.open ? " checked" : "") + "> 公開する</label>" +
            '<label class="chk"><input type="checkbox" data-pb="ranking"' + (edit.ranking ? " checked" : "") + "> チームの進み具合を表示</label></div>" +
          '<label>タイトル</label><input data-p="title" value="' + esc(edit.title) + '" maxlength="60">' +
          '<label>サブタイトル</label><input data-p="subtitle" value="' + esc(edit.subtitle) + '" maxlength="100">' +
          '<label>1チームの人数</label><input data-p="teamSize" type="number" min="1" max="8" value="' + edit.teamSize + '" style="width:100px"></div></div>' +
        '<div class="panel ed"><div class="phead"><h2>👥 チーム</h2><span class="sub">名前と色。チームを消すと、そのチームの記録は見えなくなります</span></div><div class="pbody">' +
          edit.teams.map((t, i) => '<div class="row" style="margin-bottom:6px"><input type="color" data-tc="' + i + '" value="' + t.color + '"><input data-tn="' + i + '" value="' + esc(t.name) + '" maxlength="30" style="flex:1">' +
            '<button class="xbtn sm danger" data-tdel="' + i + '">削除</button></div>').join("") +
          '<button class="xbtn sm" id="tadd">＋ チームを足す</button></div></div>' +
        '<div class="panel ed"><div class="phead"><h2>🌅 イントロ（ストーリー＋画像）</h2></div><div class="pbody">' +
          '<label>見出し</label><input data-p="intro.title" value="' + esc(edit.intro.title) + '">' + imgRow("intro.img", edit.intro.img, "assets/nazo/intro.png") +
          '<label>ストーリー</label><textarea data-p="intro.text" style="min-height:140px">' + esc(edit.intro.text) + "</textarea></div></div>" +
        '<div class="panel ed"><div class="phead"><h2>🧩 問題</h2><span class="sub">画像は 16:9（例 1600×900）がおすすめ</span></div><div class="pbody">' +
          edit.questions.map((q, i) => '<div class="edc" data-qi="' + i + '"><div class="row"><b style="font-size:13px">問題 ' + (i + 1) + '</b><div class="spacer"></div>' +
              '<button class="xbtn sm" data-qm="-1"' + (i ? "" : " disabled") + '>▲</button><button class="xbtn sm" data-qm="1"' + (i < edit.questions.length - 1 ? "" : " disabled") + ">▼</button>" +
              '<button class="xbtn sm danger" data-qdel>削除</button></div>' +
            '<label>タイトル</label><input data-qf="title" value="' + esc(q.title) + '" maxlength="60">' +
            '<div class="row" style="align-items:flex-end"><span class="pv" style="background-image:url(\'' + esc(q.img) + '\')"></span><div style="flex:1;min-width:200px"><label>画像</label><input data-qf="img" value="' + esc(q.img) + '" placeholder="assets/nazo/q' + (i + 1) + '.png"></div></div>' +
            '<label>問題文・補足（任意）</label><textarea data-qf="text">' + esc(q.text) + "</textarea>" +
            '<label>キーワード欄の説明（任意・例：ひらがな3文字）</label><input data-qf="kwHint" value="' + esc(q.kwHint || "") + '" maxlength="60">' +
            '<label>ヒント（任意）</label><textarea data-qf="hint" style="min-height:60px">' + esc(q.hint) + "</textarea></div>").join("") +
          '<button class="xbtn sm" id="qadd">＋ 問題を足す</button></div></div>' +
        '<div class="panel ed"><div class="phead"><h2>🔑 最終回答</h2><span class="sub">答えはここの1つだけ。チームが提出 → 管理者が「チームの進行」で結果を発表すると、アウトロが開きます</span></div><div class="pbody">' +
          '<label>見出し</label><input data-p="final.title" value="' + esc(edit.final.title) + '">' + imgRow("final.img", edit.final.img, "（任意）assets/nazo/final.png") +
          '<label>説明（任意）</label><textarea data-p="final.text">' + esc(edit.final.text) + "</textarea>" +
          '<label>答え（「、」区切りで複数OK。ひらがな/カタカナ/大文字小文字/空白は区別しません）</label>' +
          '<input data-p="final._new" value="' + esc(edit.final._new || "") + '" placeholder="' + (edit.final.hashes.length ? "登録済み " + edit.final.hashes.length + "個（暗号化して保存中）。変えるときだけ入力" : "例：ひかり、光") + '">' +
          '<div class="row" style="margin-top:6px"><input id="fchk" placeholder="答えの確認：ここに入れて▶" style="flex:1;min-width:160px"><button class="xbtn sm" id="fchkBtn" type="button">▶ 判定</button><span class="note" id="fchkR"></span></div>' +
          '<label>ヒント（任意）</label><textarea data-p="final.hint" style="min-height:60px">' + esc(edit.final.hint) + "</textarea></div></div>" +
        '<div class="panel ed"><div class="phead"><h2>🌙 アウトロ（ストーリー＋解説＋画像）</h2><span class="sub">全問正解したチームにだけ開きます</span></div><div class="pbody">' +
          '<label>見出し</label><input data-p="outro.title" value="' + esc(edit.outro.title) + '">' + imgRow("outro.img", edit.outro.img, "assets/nazo/outro.png") +
          '<label>ストーリー</label><textarea data-p="outro.text" style="min-height:120px">' + esc(edit.outro.text) + "</textarea>" +
          '<label>解説</label><textarea data-p="outro.explain" style="min-height:140px">' + esc(edit.outro.explain) + "</textarea>" +
          '<label>解説の画像（任意）</label><input data-p="outro.explainImg" value="' + esc(edit.outro.explainImg) + '" placeholder="assets/nazo/explain.png"></div></div>' +
        '<div class="savebar' + (dirty ? " dirty" : "") + '"><b style="font-size:12.5px">謎解き</b><span class="note">' + (dirty ? "未保存の変更があります" : "保存済み") + '</span><div class="spacer"></div>' +
          '<button class="xbtn sm" id="erev">もとに戻す</button><button class="xbtn main sm" id="esave">💾 保存</button></div>';
    }
    $("view").innerHTML = html;
    bindGm();
  }
  // 自動判定（答えの暗号と照らし合わせる。結果はキャッシュ）
  const judgeCache = {};
  function autoJudge(ans){
    const k = normAns(ans);
    if (k in judgeCache) return judgeCache[k];
    judgeCache[k] = null;
    hashAns("final", ans).then(h => {
      judgeCache[k] = cfg.final.hashes.includes(h) || cfg.final.answers.some(a => normAns(a) === k);
      if (gm && gmTab === "prog") render();
    });
    return null;
  }
  async function reveal(tid, mode){
    const t = T[tid]; if (!t || !t.answer) return;
    let ok = mode === "1";
    if (mode === "auto"){ const h = await hashAns("final", t.answer.ans); ok = cfg.final.hashes.includes(h) || cfg.final.answers.some(a => normAns(a) === normAns(t.answer.ans)); }
    await store.merge(TDOC(tid), { result: { ok, at: Date.now() } });
  }
  function bindGm(){
    document.querySelectorAll("[data-gt]").forEach(b => b.onclick = () => { gmTab = b.dataset.gt; render(); });
    $("toPlayer").onclick = () => { if (dirty && !confirm("未保存の変更を捨てますか？")) return; gm = false; edit = null; dirty = false; render(); };
    document.querySelectorAll("[data-spec]").forEach(b => b.onclick = () => { spectate = b.dataset.spec; gm = false; slide = (T[spectate] && T[spectate].cur) || "intro"; lastKey = ""; render(); });
    document.querySelectorAll("[data-kick]").forEach(b => b.onclick = () => { const [tid, k] = b.dataset.kick.split("|"); if (confirm("このメンバーをチームから外しますか？")) store.del(TDOC(tid), "members." + k).catch(e => toast(e.message)); });
    document.querySelectorAll("[data-phase]").forEach(b => b.onclick = async () => {
      const ph = b.dataset.phase;
      if (ph === S.phase) return;
      const msg = { prologue: "全チームをプロローグの画面にもどしますか？（謎は閉じます）",
        play: S.startAt ? "謎解きを再開しますか？（タイムはさいしょのスタートから数えます）" : "全チームいっせいに謎解きをスタートしますか？（タイム計測が始まります）",
        epilogue: "全チームの画面をエピローグに切り替えますか？（最終回答の提出は締め切られます）" }[ph];
      if (!confirm(msg)) return;
      const w = { phase: ph, at: Date.now() };
      if (ph === "play" && !S.startAt) w.startAt = Date.now();
      try { await store.merge(DOC_ST, w); toast("切り替えました"); } catch(e){ toast(e.message); }
    });
    document.querySelectorAll("[data-rev]").forEach(b => b.onclick = async () => {
      const [tid, mode] = b.dataset.rev.split("|");
      const msg = mode === "auto" ? "自動判定のとおりに" : mode === "1" ? "⭕ 正解として" : "❌ 不正解として";
      if (!confirm("「" + teamCfg(tid).name + "」の結果を" + msg + "発表しますか？")) return;
      try { await reveal(tid, mode); toast("発表しました"); } catch(e){ toast(e.message); }
    });
    document.querySelectorAll("[data-unrev]").forEach(b => b.onclick = async () => {
      if (!confirm("発表を取り消して、発表前にもどしますか？")) return;
      store.del(TDOC(b.dataset.unrev), "result").catch(e => toast(e.message));
    });
    if ($("revAll")) $("revAll").onclick = async () => {
      const ids = cfg.teams.map(x => x.id).filter(id => T[id] && T[id].answer && !T[id].result);
      if (!ids.length) return toast("発表待ちのチームはありません");
      if (!confirm(ids.length + "チームの結果を、自動判定のとおりに発表しますか？")) return;
      for (const id of ids) await reveal(id, "auto").catch(e => toast(e.message));
      toast(ids.length + "チームの結果を発表しました");
    };
    document.querySelectorAll("[data-treset]").forEach(b => b.onclick = async () => {
      if (!confirm("このチームの進み具合・メモ・書き込みを消します（メンバーは残ります）")) return;
      const t = T[b.dataset.treset] || normTeam(null);
      await store.put(TDOC(b.dataset.treset), { members: t.members }); toast("リセットしました");
    });
    if ($("resetAll")) $("resetAll").onclick = async () => {
      if (!confirm("全チームの進み具合・メモ・書き込み・メンバーを消して、プロローグ（スタート前）にもどします。よろしいですか？")) return;
      for (const tc of cfg.teams) await store.put(TDOC(tc.id), {});
      await store.put(DOC_ST, { phase: "prologue", startAt: 0, at: Date.now() });
      toast("全チームをリセットしました");
    };
    if (gmTab !== "edit") return;
    const mark = () => { if (!dirty){ dirty = true; const sb = document.querySelector(".savebar"); if (sb){ sb.classList.add("dirty"); sb.querySelector(".note").textContent = "未保存の変更があります"; } } };
    const setPath = (path, v) => { const ps = path.split("."); let o = edit; for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]]; o[ps[ps.length - 1]] = v; };
    document.querySelectorAll("[data-p]").forEach(el => el.oninput = () => {
      setPath(el.dataset.p, el.dataset.p === "teamSize" ? Math.max(1, Math.min(8, el.value | 0)) : el.value); mark();
      const pv = el.closest(".row") && el.closest(".row").querySelector(".pv"); if (pv && /img$/.test(el.dataset.p)) pv.style.backgroundImage = "url('" + el.value.replace(/'/g, "") + "')";
    });
    document.querySelectorAll("[data-pb]").forEach(el => el.onchange = () => { edit[el.dataset.pb] = el.checked; mark(); });
    document.querySelectorAll("[data-tn]").forEach(el => el.oninput = () => { edit.teams[+el.dataset.tn].name = el.value; mark(); });
    document.querySelectorAll("[data-tc]").forEach(el => el.oninput = () => { edit.teams[+el.dataset.tc].color = el.value; mark(); });
    document.querySelectorAll("[data-tdel]").forEach(b => b.onclick = () => { if (confirm("このチームを削除しますか？")){ edit.teams.splice(+b.dataset.tdel, 1); dirty = true; render(); } });
    $("tadd").onclick = () => { const n = edit.teams.length; edit.teams.push({ id: "t" + uid(), name: "チーム" + (n + 1), color: TEAM_COLORS[n % TEAM_COLORS.length] }); dirty = true; render(); };
    document.querySelectorAll("[data-qi]").forEach(box => {
      const i = +box.dataset.qi, q = edit.questions[i];
      box.querySelectorAll("[data-qf]").forEach(el => el.oninput = () => {
        q[el.dataset.qf] = el.value; mark();
        if (el.dataset.qf === "img") box.querySelector(".pv").style.backgroundImage = "url('" + el.value.replace(/'/g, "") + "')";
      });
      box.querySelectorAll("[data-qm]").forEach(b => b.onclick = () => { const j = i + Number(b.dataset.qm); const x = edit.questions[i]; edit.questions[i] = edit.questions[j]; edit.questions[j] = x; dirty = true; render(); });
      box.querySelector("[data-qdel]").onclick = () => { if (confirm("この問題を削除しますか？")){ edit.questions.splice(i, 1); dirty = true; render(); } };
    });
    $("fchkBtn").onclick = async () => {
      const f = edit.final, v = $("fchk").value, r = $("fchkR");
      const news = String(f._new || "").split(/[、,，\n]/).map(x => x.trim()).filter(Boolean);
      const ok = news.length ? news.some(a => normAns(a) === normAns(v)) : f.hashes.includes(await hashAns("final", v));
      r.textContent = ok ? "⭕ 正解になります" : "✖ 不正解になります"; r.style.color = ok ? "var(--ok)" : "var(--danger)";
    };
    $("qadd").onclick = () => { const n = edit.questions.length + 1; edit.questions.push({ id: "q" + uid(), title: "第" + n + "の謎", img: "assets/nazo/q" + n + ".png", text: "", hint: "", kwHint: "" }); dirty = true; render(); };
    $("erev").onclick = () => { if (!dirty || confirm("編集中の内容を捨てますか？")){ edit = null; render(); } };
    $("esave").onclick = async () => {
      try {
        const out = JSON.parse(JSON.stringify(edit));
        const f = out.final;
        const news = String(f._new || "").split(/[、,，\n]/).map(x => x.trim()).filter(Boolean);
        if (news.length) f.hashes = await Promise.all(news.map(a => hashAns("final", a)));
        if (!f.hashes.length) throw new Error("最終回答の答えが入っていません");
        f.answers = []; delete f._new;              // 答えそのものは保存しない
        if (!out.teams.length) throw new Error("チームを1つ以上作ってください");
        const next = normCfg(Object.assign(out, { updatedAt: Date.now() }));
        await store.put(DOC_CFG, next);
        edit = null; dirty = false; toast("保存しました（答えは暗号化して保存）"); render();
      } catch(e){ toast("保存できませんでした：" + e.message); }
    };
  }

  /* ---------- 起動 ---------- */
  if (IS_GM){
    $("gmBtn").style.display = "";
    $("gmBtn").onclick = () => { if (gm && dirty && !confirm("未保存の変更を捨てますか？")) return; gm = !gm; spectate = ""; edit = null; dirty = false; lastKey = ""; render(); };
  }
  window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });
  store.sub(DOC_ST, raw => {
    const before = S, first = !stReady; S = normState(raw); stReady = true;
    if (!first && before.phase !== S.phase){
      // 管理者の切り替えで、全員の画面を動かす
      if (S.phase === "play" && cfg.questions[0] && (slide === "intro" || slide === "outro")) slide = cfg.questions[0].id;
      if (S.phase === "epilogue") slide = "outro";
      if (S.phase === "prologue") slide = "intro";
      if (!gm) toast(S.phase === "play" ? "🔍 謎解きスタート！" : S.phase === "epilogue" ? "🌙 エピローグが始まりました" : "🌅 プロローグにもどりました");
    } else if (first && S.phase === "epilogue") slide = "outro";
    lastKey = "";
    if (!(gm && gmTab === "edit")) render();
  });
  store.sub(DOC_CFG, raw => {
    cfg = normCfg(raw); cfgReady = true; syncSubs();
    if (!(gm && gmTab === "edit")){ lastKey = ""; render(); }
  });
})();
</script>
</body>
</html>
